<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strokes">
<meta name="theme-color" content="#EDF0E6">
<title>Stroke Counter</title>
<style>
  :root {
    --paper: #EDF0E6;
    --white: #FBFCF8;
    --ink: #17241B;
    --mute: #5D6B60;
    --line: #CBD2C0;
    --fairway: #1E5233;
    --fairway-deep: #143A24;
    --sand: #E3D5AC;
    --flag: #C4372D;
    --under: #24763F;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.35 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--fairway); outline-offset: 2px; }
  #app { height: 100%; }

  .screen { height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-t); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; min-height: 52px; }
  .top h1, .top h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .top h2 { font-size: 20px; }
  .ghost { background: none; border: 0; color: var(--fairway); font-weight: 700; padding: 10px 4px; min-height: 44px; }

  .gps { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 5px 11px;
         border-radius: 999px; background: var(--white); border: 1px solid var(--line); }
  .gps::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #9AA79B; }
  .gps.good::before { background: #2E8B4E; }
  .gps.ok::before { background: #D9A21B; }
  .gps.bad::before { background: var(--flag); }

  /* Round screen */
  .holebar { display: flex; align-items: center; justify-content: space-between; padding: 2px 14px; }
  .step { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--fairway); background: transparent;
          color: var(--fairway); font-size: 30px; line-height: 1; font-weight: 700; padding: 0 0 4px; }
  .step:disabled { opacity: .28; }
  .holetitle { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .holetitle small { font-size: 14px; font-weight: 600; color: var(--mute); margin-left: 6px; letter-spacing: 0; }

  .counter { text-align: center; padding: 0 14px 8px; }
  .holeinfo { display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 17px; font-weight: 700; min-height: 30px; }
  .topar { background: var(--sand); border-radius: 999px; padding: 1px 11px; font-variant-numeric: tabular-nums; }
  .over { color: var(--flag); }
  .under { color: var(--under); }
  .big { font-size: 132px; font-size: clamp(76px, 15dvh, 130px); line-height: 1.02; font-weight: 800;
         letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--fairway-deep); }
  .sub { color: var(--mute); font-size: 15px; font-weight: 600; }

  .strokes { list-style: none; margin: 0; padding: 0 14px; flex: 1; min-height: 0; overflow-y: auto;
             border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
  .strokes li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .stroke { flex: 1; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 9px 0;
            min-height: 52px; text-align: left; }
  .n { width: 30px; height: 30px; border-radius: 50%; background: var(--fairway); color: var(--white);
       display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .club { font-weight: 700; font-size: 18px; }
  .nopos { color: var(--flag); font-size: 12px; font-weight: 600; }
  .dist { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .dist.muted { color: var(--mute); font-weight: 400; }
  .measure { display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--fairway); background: none;
             color: var(--fairway-deep); border-radius: 999px; padding: 6px 16px 6px 12px; font-weight: 800; font-size: 18px;
             font-variant-numeric: tabular-nums; min-height: 44px; }
  .measure:active { background: var(--sand); }
  .stop-icon { width: 14px; height: 14px; border-radius: 3px; background: var(--flag); flex: none; }
  .hint-empty { padding: 18px 0; color: var(--mute); font-size: 15px; }

  .dock { padding: 10px 14px calc(10px + var(--safe-b)); background: var(--white); border-top: 1px solid var(--line); }
  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .chip { min-height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper);
          font-weight: 700; font-size: 14px; padding: 0 2px; }
  .chip.on { background: var(--sand); border-color: var(--ink); }
  .chip-bag { border-style: dashed; background: transparent; color: var(--mute); }
  .actions { display: flex; gap: 10px; }
  .undo { width: 88px; min-height: 76px; border-radius: 20px; border: 2px solid var(--line); background: transparent;
          font-weight: 700; color: var(--mute); }
  .undo:disabled { opacity: .4; }
  .add { flex: 1; min-height: 76px; border-radius: 20px; border: 0; background: var(--fairway); color: var(--white);
         font-size: 30px; font-weight: 800; box-shadow: 0 4px 0 var(--fairway-deep); }
  .add:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fairway-deep); }

  /* Lists (rounds and courses) */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; -webkit-overflow-scrolling: touch; }
  .rounds { list-style: none; margin: 0; padding: 0; }
  .round-item { display: flex; gap: 6px; margin-bottom: 10px; align-items: stretch; }
  .round-open { flex: 1; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center;
                text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .rn { grid-column: 1; font-weight: 800; font-size: 18px; }
  .rm { grid-column: 1; color: var(--mute); font-size: 14px; }
  .rt { grid-column: 2; grid-row: 1 / span 2; text-align: right; color: var(--mute); font-size: 13px; font-weight: 600; }
  .rt b { display: block; font-size: 36px; line-height: 1; color: var(--fairway-deep); font-weight: 800; font-variant-numeric: tabular-nums; }
  .round-del { width: 44px; border: 0; background: none; color: var(--mute); font-size: 18px; }
  .empty { color: var(--mute); padding: 24px 4px; font-size: 17px; }

  .primary { width: 100%; min-height: 58px; border-radius: 16px; border: 0; background: var(--fairway); color: var(--white);
             font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 var(--fairway-deep); }
  .primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fairway-deep); }
  .link { width: 100%; min-height: 44px; background: none; border: 0; color: var(--mute); padding: 10px; font-weight: 600; }
  .linkrow { display: flex; gap: 8px; }
  .danger { width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid var(--flag); background: none;
            color: var(--flag); font-weight: 700; margin-top: 4px; }

  /* Bottom sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(23, 36, 27, .45); z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--white);
           border-radius: 22px 22px 0 0; padding: 18px 16px calc(14px + var(--safe-b)); max-height: 88%; overflow-y: auto;
           animation: rise .18s ease-out; }
  .sheet h2 { margin: 0 0 12px; font-size: 22px; font-weight: 800; }
  .hint { margin: 0 0 8px; color: var(--mute); font-size: 14px; }
  .sheet .chips + .hint { margin: -2px 0 14px; }
  .field { display: block; }
  .field + .field { margin-top: 12px; }
  .field span { display: block; font-size: 14px; color: var(--mute); font-weight: 600; margin-bottom: 6px; }
  .field input, .field select { width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: 12px; padding: 0 12px;
                 font: inherit; font-size: 17px; background: var(--paper); color: var(--ink); }
  .json-box { width: 100%; min-height: 150px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
              font: 14px/1.4 ui-monospace, Menlo, monospace; background: var(--paper); color: var(--ink); resize: vertical; }
  .seg { display: flex; gap: 8px; margin: 14px 0 0; }
  .seg + .seg { margin-top: 8px; }
  .seg + .primary, .field + .seg { margin-top: 14px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 13px 8px; border-radius: 12px; border: 2px solid var(--line);
              font-weight: 700; }
  .seg input:checked + span { background: var(--sand); border-color: var(--ink); }
  .seg input:disabled + span { opacity: .35; }
  .seg input:focus-visible + span { outline: 3px solid var(--fairway); outline-offset: 2px; }
  .sheet .primary { margin-top: 16px; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Course editor */
  .hole-head, .hole-row { display: grid; grid-template-columns: 26px 1fr 66px 46px; gap: 8px; align-items: center; }
  .hole-head { color: var(--mute); font-size: 13px; font-weight: 600; padding: 14px 0 4px; }
  .hole-head span:first-child { text-align: center; }
  .hole-head span:nth-child(n+3) { text-align: right; }
  .hole-row { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hn { font-weight: 800; font-size: 16px; text-align: center; }
  .pars { display: flex; gap: 6px; }
  .par-btn { flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper);
             font-weight: 800; font-size: 17px; padding: 0; }
  .par-btn.on { background: var(--sand); border-color: var(--ink); }
  .len, .idx { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit;
         font-size: 17px; text-align: right; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
  .totals { margin: 14px 0 0; font-weight: 700; font-size: 16px; }
  .delete-link { margin-top: 18px; }
  .idx { padding: 0 6px; }
  .row2 { display: flex; gap: 10px; margin-top: 12px; }
  .row2 .field { flex: 1; min-width: 0; }
  .row2 .field + .field { margin-top: 0; }
  .extra { border: 2px solid var(--fairway); border-radius: 999px; padding: 0 10px; font-size: 15px; color: var(--fairway-deep); }
  .modebar { display: flex; gap: 8px; margin: 4px 0 8px; }
  .modebtn { flex: 1; min-height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); font-weight: 700; }
  .modebtn.on { background: var(--sand); border-color: var(--ink); }
  .hcp-line { margin: 0 0 6px; }
  .inline-btn { background: none; border: 0; padding: 6px 0; color: var(--fairway); font-weight: 700;
                text-decoration: underline; text-underline-offset: 3px; }

  /* Scorecard */
  .score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .score th { text-align: right; font-size: 13px; color: var(--mute); font-weight: 600; padding: 8px 3px; }
  .score th:first-child, .score td:first-child { text-align: left; }
  .score td { text-align: right; padding: 6px 3px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; }
  .score tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--ink); font-size: 17px; }
  .cellbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sand); font-weight: 800; font-size: 15px; }
  .card-title { margin: 6px 0 10px; font-size: 20px; font-weight: 800; }
  .card-title small { display: block; font-size: 14px; color: var(--mute); font-weight: 600; }
  .score-h3 { margin: 26px 0 4px; font-size: 18px; font-weight: 800; }
  .note { color: var(--mute); font-size: 13px; margin: 8px 0 0; }

  #toast { position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 50;
           background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 600;
           opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    #toast { transition: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript>Stroke Counter requires JavaScript.</noscript>

<script>
'use strict';

/* ---------- Data and storage ---------- */

const STORAGE_KEY = 'golf-strokes.v1';
const CLUBS = ['Driver', '3W', '5W', 'Hybrid', '4i', '5i', '6i', '7i', '8i', '9i', 'PW', 'GW', 'SW', 'LW', 'Putter'];
const PARS = [3, 4, 5, 6];
const ALLOWANCES = [100, 95, 90, 85];   // handicap adjustment percentages
const HCP_HINT = 'Read it from the slope table for your tee (the 9-hole value when playing 9 holes). Adjustment is the competition percentage; keep 100% for a casual round.';
const NO_INDEX_HINT = 'This course has no hole index yet, so extra strokes will not be calculated. Add the index under My courses.';
const FIX_MAX_AGE_MS = 30000;

/*
  db = {
    courses: [{ id, name, holes: [{ par, length, index }, ...] }],   // 9 or 18 holes, length in meters, index 1-18 (or null)
    rounds: [{ id, name, createdAt, holeCount, startHole, sourceHoleCount, currentHole,
               courseId,                                      // null when played without a course
               holeData: { "1": { par, length, index }, ... }, // copied from the course when the round starts
               handicap: { base, allowance } | null,           // playing handicap from the slope table + adjustment %
               holes: { "1": [stroke, ...], ... } }],         // keyed by real hole number (startHole ...)
    allowance: 100,            // last used handicap adjustment %
    activeClubs: [...],        // clubs in the bag, shown when adding a stroke
    club: 'Driver',            // club selected for the next stroke
    activeRoundId: null        // round that was open last time
  }
  stroke = { t, club, lat, lng, acc, landing?: { lat, lng, acc } }
*/

function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.rounds)) {
        let activeClubs = Array.isArray(data.activeClubs)
          ? CLUBS.filter(c => data.activeClubs.includes(c))
          : [...CLUBS];
        if (activeClubs.length === 0) activeClubs = [...CLUBS];
        const courses = Array.isArray(data.courses)
          ? data.courses.filter(c => c && typeof c.name === 'string' && Array.isArray(c.holes))
          : [];
        return {
          courses,
          allowance: ALLOWANCES.includes(Number(data.allowance)) ? Number(data.allowance) : 100,
          rounds: data.rounds,
          activeClubs,
          club: activeClubs.includes(data.club) ? data.club : activeClubs[0],
          activeRoundId: data.activeRoundId || null
        };
      }
    }
  } catch (err) { /* ignore and start fresh */ }
  return { courses: [], rounds: [], allowance: 100, activeClubs: [...CLUBS], club: CLUBS[0], activeRoundId: null };
}

function saveDb() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (err) {
    toast('Could not save. Storage is full or blocked.');
  }
}

let db = loadDb();
let view = 'list';       // 'list' | 'round' | 'card' | 'courses' | 'course-edit'
let roundId = null;
let sheet = null;        // null | { type: 'new' | 'bag' | 'import' } | { type: 'stroke', index }
let draft = null;        // course being created or edited: { id, name, count, all: [{ par, length, index }] x18 }
let cardMode = 'gross';  // scorecard view: 'gross' | 'net'
let lastFix = null;
let gpsErrorCode = null;
let watchId = null;
let wakeLock = null;
let toastTimer = null;

const app = document.getElementById('app');

/* ---------- Helpers ---------- */

const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });

function esc(value) {
  return String(value).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function getRound() {
  return db.rounds.find(r => r.id === roundId) || null;
}

function holeList(round, hole) {
  if (!round.holes[hole]) round.holes[hole] = [];
  return round.holes[hole];
}

// Real hole numbers played in a round, e.g. [10, 11, ..., 18] for a back nine.
function holeNumbers(round) {
  const start = round.startHole || 1;
  return Array.from({ length: round.holeCount }, (_, i) => start + i);
}

function holeInfo(round, hole) {
  return (round.holeData && round.holeData[hole]) || null;
}

// Strokes minus par for a hole, or null when nothing is played or par is unknown.
function holeToPar(round, hole) {
  const info = holeInfo(round, hole);
  const count = (round.holes[hole] || []).length;
  if (!info || !count) return null;
  return count - info.par;
}

function fmtToPar(diff) {
  if (diff === null || diff === undefined) return '–';
  if (diff === 0) return 'E';
  return diff > 0 ? '+' + diff : '−' + Math.abs(diff);
}

function toParClass(diff) {
  if (diff === null || diff === undefined || diff === 0) return '';
  return diff > 0 ? 'over' : 'under';
}

// Playing handicap after the adjustment percentage, or null when none is set.
function adjustedHandicap(round) {
  if (!round.handicap) return null;
  return Math.round(round.handicap.base * round.handicap.allowance / 100);
}

// Extra (handicap) strokes on a hole, or null when they can't be calculated
// (no handicap, or a played hole without a hole index).
// The holes played are ranked by index; with n holes and playing handicap PH,
// every hole gets floor(PH / n) strokes and the easiest-to-get ranks 1..(PH mod n) get one more.
function strokesReceived(round, hole) {
  const ph = adjustedHandicap(round);
  if (ph === null) return null;
  const numbers = holeNumbers(round);
  const indexOf = h => { const info = holeInfo(round, h); return info ? info.index : null; };
  if (numbers.some(h => !Number.isInteger(indexOf(h)))) return null;
  const ranked = [...numbers].sort((a, b) => indexOf(a) - indexOf(b));
  const rank = ranked.indexOf(hole) + 1;
  if (rank === 0) return null;
  const n = numbers.length;
  return Math.floor(ph / n) + (rank <= ph % n ? 1 : 0);
}

function allowanceOptions(selected) {
  return ALLOWANCES.map(a => `<option value="${a}"${a === selected ? ' selected' : ''}>${a}%</option>`).join('');
}

function roundTotals(round) {
  let total = 0;
  let played = 0;
  let toPar = null;
  for (const hole of holeNumbers(round)) {
    const n = (round.holes[hole] || []).length;
    total += n;
    if (n > 0) played++;
    const diff = holeToPar(round, hole);
    if (diff !== null) toPar = (toPar || 0) + diff;
  }
  return { total, played, toPar };
}

// Label next to the hole number: "of 18", "front 9" or "back 9".
function holeSuffix(round) {
  if ((round.startHole || 1) > 1) return 'back 9';
  if (round.holeCount === 9 && round.sourceHoleCount === 18) return 'front 9';
  return 'of ' + round.holeCount;
}

function courseTotals(holes) {
  return {
    par: holes.reduce((sum, h) => sum + h.par, 0),
    meters: holes.reduce((sum, h) => sum + (h.length || 0), 0)
  };
}

function fmtMeters(m) {
  return m.toLocaleString('en-GB') + ' m';
}

function hasPos(p) {
  return !!p && typeof p.lat === 'number' && typeof p.lng === 'number';
}

// Great-circle distance in meters (haversine formula).
function meters(a, b) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad;
  const dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Distance for stroke i: from the stroke position to the manually measured
// landing spot, otherwise to the position of the next stroke on the same hole.
function shotDistance(list, i) {
  const stroke = list[i];
  if (!stroke || stroke.club === 'Putter' || !hasPos(stroke)) return null;
  const end = hasPos(stroke.landing) ? stroke.landing : (hasPos(list[i + 1]) ? list[i + 1] : null);
  if (!end) return null;
  return { m: meters(stroke, end), approx: (stroke.acc || 0) + (end.acc || 0) > 25 };
}

function fmtDist(d) {
  if (!d) return '';
  const m = Math.round(d.m);
  return (d.approx ? '≈ ' : '') + (m < 1 ? '<1' : m) + ' m';
}

function roundLabel(round) {
  return round.name || dateFmt.format(round.createdAt);
}

function toast(message) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- GPS and screen wake lock ---------- */

function onFix(pos) {
  gpsErrorCode = null;
  lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, t: Date.now() };
  updateGps();
  updateLiveDistance();
}

// Updates the running distance on the measure button (last stroke of the hole)
// from the stroke position to the current GPS position.
function updateLiveDistance() {
  const el = document.getElementById('live-dist');
  if (!el || view !== 'round') return;
  const round = getRound();
  if (!round) return;
  const list = holeList(round, round.currentHole);
  const stroke = list[list.length - 1];
  const fix = freshFix();
  if (!stroke || !hasPos(stroke) || !fix) { el.textContent = '…'; return; }
  el.textContent = fmtDist({
    m: meters(stroke, fix),
    approx: (stroke.acc || 0) + (fix.acc || 0) > 25
  });
}

function onGpsError(err) {
  gpsErrorCode = err.code;
  updateGps();
}

function startGps() {
  if (!('geolocation' in navigator) || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 30000
  });
}

function stopGps() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
}

function freshFix() {
  return lastFix && Date.now() - lastFix.t < FIX_MAX_AGE_MS ? lastFix : null;
}

function updateGps() {
  const el = document.getElementById('gps');
  if (!el) return;
  let cls = 'wait';
  let text = 'Searching GPS…';
  if (!('geolocation' in navigator)) {
    cls = 'bad'; text = 'No GPS';
  } else if (gpsErrorCode === 1) {
    cls = 'bad'; text = 'Location access denied';
  } else if (freshFix()) {
    const acc = Math.round(lastFix.acc);
    cls = acc <= 10 ? 'good' : (acc <= 25 ? 'ok' : 'bad');
    text = 'GPS ±' + acc + ' m';
  }
  el.className = 'gps ' + cls;
  el.textContent = text;
}

async function requestWake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) { wakeLock = null; }
}

function releaseWake() {
  try { if (wakeLock) wakeLock.release(); } catch (err) { /* nothing to do */ }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (view === 'round' || view === 'card')) {
    startGps();
    requestWake();
  }
});
setInterval(() => { updateGps(); updateLiveDistance(); }, 5000);

function renderRound() {
  const round = getRound();
  const hole = round.currentHole;
  const firstHole = round.startHole || 1;
  const lastHole = firstHole + round.holeCount - 1;
  const list = holeList(round, hole);
  const totals = roundTotals(round);
  const info = holeInfo(round, hole);
  const diff = holeToPar(round, hole);
  const extra = strokesReceived(round, hole);
  const last = list.length - 1;

  const rows = list.map((s, i) => {
    const d = shotDistance(list, i);
    let right;
    if (s.club === 'Putter') {
      right = '<span class="dist muted">–</span>';
    } else if (d) {
      right = `<span class="dist">${fmtDist(d)}</span>`;
    } else if (i === last && hasPos(s)) {
      // Live measurement: shows the distance from this stroke to where you stand now.
      // Tapping it stops the measurement and locks the distance.
      right = `<button class="measure" data-action="measure" aria-label="Stop and lock this distance">
                 <span class="stop-icon" aria-hidden="true"></span>
                 <span id="live-dist">…</span>
               </button>`;
    } else {
      right = '<span class="dist muted">–</span>';
    }
    return `
      <li>
        <button class="stroke" data-action="edit-stroke" data-index="${i}">
          <span class="n">${i + 1}</span>
          <span class="club">${esc(s.club)}</span>
          ${hasPos(s) ? '' : '<span class="nopos">no position</span>'}
        </button>
        ${right}
      </li>`;
  }).join('');

  const infoHtml = info
    ? `<div class="holeinfo">
         <span>Par ${info.par}</span>
         ${info.length ? `<span>${info.length} m</span>` : ''}
         ${extra ? `<span class="extra">${extra} extra</span>` : ''}
         ${diff !== null ? `<span class="topar ${toParClass(diff)}">${fmtToPar(diff)}</span>` : ''}
       </div>`
    : '<div class="holeinfo"></div>';
  const roundPart = totals.toPar === null ? '' : `, ${fmtToPar(totals.toPar)} to par`;

  return `
    <div class="screen">
      <header class="top">
        <button class="ghost" data-action="back">‹ Rounds</button>
        <div class="gps wait" id="gps">Searching GPS…</div>
        <button class="ghost" data-action="scorecard">Scorecard</button>
      </header>
      <div class="holebar">
        <button class="step" data-action="prev-hole" ${hole <= firstHole ? 'disabled' : ''} aria-label="Previous hole">‹</button>
        <div class="holetitle">Hole ${hole}<small>${holeSuffix(round)}</small></div>
        <button class="step" data-action="next-hole" ${hole >= lastHole ? 'disabled' : ''} aria-label="Next hole">›</button>
      </div>
      <section class="counter" aria-live="polite">
        ${infoHtml}
        <div class="big">${list.length}</div>
        <div class="sub">strokes on this hole, ${totals.total} in the round${roundPart}</div>
      </section>
      <ol class="strokes">
        ${rows || '<li class="hint-empty">Tap +1 stroke right after each shot, while you are still standing where you hit from. Distance is measured to your next stroke.</li>'}
      </ol>
      <footer class="dock">
        <div class="chips">
          ${chipsHtml(db.activeClubs, db.club, 'pick-club')}
          <button class="chip chip-bag" data-action="edit-bag">Bag</button>
        </div>
        <div class="actions">
          <button class="undo" data-action="undo" ${list.length ? '' : 'disabled'}>Undo</button>
          <button class="add" data-action="add">+1 stroke</button>
        </div>
      </footer>
    </div>`;
}

function renderCard() {
  const round = getRound();
  const hasInfo = !!round.holeData && Object.keys(round.holeData).length > 0;
  const hasExtras = strokesReceived(round, round.startHole || 1) !== null;
  const net = cardMode === 'net' && hasExtras;
  const clubStats = {};
  let longestAll = null;
  let parSum = 0;
  let metersSum = 0;
  let extraSum = 0;
  let shownTotal = 0;
  let diffTotal = null;

  let rows = '';
  for (const h of holeNumbers(round)) {
    const list = round.holes[h] || [];
    const info = holeInfo(round, h);
    const extra = hasExtras ? strokesReceived(round, h) : null;
    const played = list.length > 0;
    const shown = played ? list.length - (net ? extra : 0) : null;
    const diff = info && played ? shown - info.par : null;
    let longest = null;
    list.forEach((s, i) => {
      const d = shotDistance(list, i);
      if (!d) return;
      if (!longest || d.m > longest.m) longest = d;
      if (!longestAll || d.m > longestAll.m) longestAll = d;
      const st = clubStats[s.club] || (clubStats[s.club] = { n: 0, sum: 0, max: 0 });
      st.n++; st.sum += d.m; st.max = Math.max(st.max, d.m);
    });
    if (info) { parSum += info.par; metersSum += info.length || 0; }
    if (extra) extraSum += extra;
    if (played) shownTotal += shown;
    if (diff !== null) diffTotal = (diffTotal || 0) + diff;
    rows += `
      <tr>
        <td><button class="cellbtn" data-action="goto-hole" data-hole="${h}" aria-label="Go to hole ${h}">${h}</button></td>
        ${hasInfo ? `<td>${info ? info.par : '–'}</td><td>${info && info.length ? info.length : '–'}</td>` : ''}
        ${hasExtras ? `<td>${extra || '–'}</td>` : ''}
        <td>${shown === null ? '–' : shown}</td>
        ${hasInfo ? `<td class="${toParClass(diff)}">${fmtToPar(diff)}</td>` : ''}
        <td>${longest ? fmtDist(longest) : '–'}</td>
      </tr>`;
  }

  const clubRows = CLUBS.filter(c => clubStats[c]).map(c => {
    const st = clubStats[c];
    return `<tr><td>${c}</td><td>${st.n}</td><td>${Math.round(st.sum / st.n)} m</td><td>${Math.round(st.max)} m</td></tr>`;
  }).join('');

  let hcpLine = '';
  if (hasInfo) {
    const hcp = round.handicap;
    const label = hcp
      ? `Playing handicap ${hcp.base}` + (hcp.allowance !== 100 ? ` at ${hcp.allowance}% = ${adjustedHandicap(round)}` : '')
      : 'Add playing handicap';
    hcpLine = `<p class="hcp-line"><button class="inline-btn" data-action="edit-handicap">${label}</button></p>`;
  }
  const modeBar = hasExtras ? `
        <div class="modebar" role="group" aria-label="Score type">
          <button class="modebtn${net ? '' : ' on'}" data-action="card-mode" data-mode="gross">Gross</button>
          <button class="modebtn${net ? ' on' : ''}" data-action="card-mode" data-mode="net">Net</button>
        </div>` : '';
  const noIndexNote = round.handicap && hasInfo && !hasExtras
    ? '<p class="note">Extra strokes need a hole index on every hole played. Add it under My courses; it applies to new rounds.</p>'
    : '';

  return `
    <div class="screen">
      <header class="top">
        <button class="ghost" data-action="card-back">‹ Back</button>
        <h2>Scorecard</h2>
        <span style="width:64px"></span>
      </header>
      <main class="scroll">
        <p class="card-title">${esc(roundLabel(round))}<small>${esc(dateFmt.format(round.createdAt))} ${esc(timeFmt.format(round.createdAt))}</small></p>
        ${hcpLine}
        ${modeBar}
        <table class="score">
          <thead><tr>
            <th>Hole</th>
            ${hasInfo ? '<th>Par</th><th>Meters</th>' : ''}
            ${hasExtras ? '<th>Extra</th>' : ''}
            <th>${net ? 'Net' : 'Strokes'}</th>
            ${hasInfo ? '<th>+/−</th>' : ''}
            <th>Longest</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td>Total</td>
            ${hasInfo ? `<td>${parSum}</td><td>${metersSum || '–'}</td>` : ''}
            ${hasExtras ? `<td>${extraSum || '–'}</td>` : ''}
            <td>${shownTotal}</td>
            ${hasInfo ? `<td class="${toParClass(diffTotal)}">${fmtToPar(diffTotal)}</td>` : ''}
            <td>${longestAll ? fmtDist(longestAll) : '–'}</td>
          </tr></tfoot>
        </table>
        ${noIndexNote}
        ${hasInfo ? `<p class="note">Par, length and index were copied from the course when the round started. +/− is ${net ? 'net strokes' : 'strokes'} minus par on holes you have played. E means even par.${hasExtras ? ' Extra is the handicap strokes you get on each hole.' : ''}</p>` : ''}
        ${clubRows ? `
          <h3 class="score-h3">Clubs</h3>
          <table class="score">
            <thead><tr><th>Club</th><th>Shots</th><th>Avg</th><th>Longest</th></tr></thead>
            <tbody>${clubRows}</tbody>
          </table>
          <p class="note">Putter is not included. ≈ means GPS accuracy was worse than about 25 m.</p>` : ''}
      </main>
    </div>`;
}

        <button class="primary" data-action="do-import">Import</button>
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'handicap') {
    const current = (getRound() || {}).handicap || null;
    return `
      <div class="backdrop" data-action="close-sheet"></div>

          </label>

        ${current ? '<button class="danger" data-action="remove-handicap" style="margin-top:10px">Remove handicap</button>' : ''}

  return `${db.activeClubs.length} of ${CLUBS.length} clubs in the bag`;

  let html;

  else if (view === 'card' && getRound()) html = renderCard();
  else if (view === 'courses') html = renderCourses();
  else if (view === 'course-edit' && draft) html = renderCourseEdit();
  else { view = 'list'; html = renderList(); }
  app.innerHTML = html + (sheet ? renderSheet() : '');
  if (view === 'round') {
    updateGps();
    updateLiveDistance();
    const strokes = app.querySelector('.strokes');
    if (strokes) strokes.scrollTop = strokes.scrollHeight;

// Reads the course and hole selection from the "New round" sheet.
function readNewRoundSelection() {
  const select = document.getElementById('round-course');
  const course = select ? db.courses.find(c => c.id === select.value) || null : null;
  const holesInput = document.querySelector('input[name="holes"]:checked');
  const nineInput = document.querySelector('input[name="nine"]:checked');
  let holeCount = holesInput ? Number(holesInput.value) || 18 : 18;
  if (course && course.holes.length === 9) holeCount = 9;
  const backNine = !!course && course.holes.length === 18 && holeCount === 9 && !!nineInput && nineInput.value === 'back';
  return { course, holeCount, startHole: backNine ? 10 : 1 };
}

// Keeps the "New round" sheet consistent with the selected course:
// - the free-text name is only used when no course is selected
// - a 9-hole course can only be played as 9 holes
// - front/back nine is only asked for when playing 9 holes on an 18-hole course
// - the handicap fields need a course, and warn when the holes to play have no index
function syncNewRoundForm() {
  const select = document.getElementById('round-course');
  const selected = select ? db.courses.find(c => c.id === select.value) || null : null;
  const nameField = document.getElementById('round-name-field');
  const radio18 = document.querySelector('input[name="holes"][value="18"]');
  const radio9 = document.querySelector('input[name="holes"][value="9"]');
  const nineSeg = document.getElementById('nine-seg');
  if (!nameField || !radio18 || !radio9 || !nineSeg) return;

  nameField.hidden = !!selected;
  if (selected && selected.holes.length === 9) {
    radio9.checked = true;
    radio18.disabled = true;
  } else {
    radio18.disabled = false;
  }
  nineSeg.hidden = !(selected && selected.holes.length === 18 && radio9.checked);

  const hcpRow = document.getElementById('hcp-row');
  const hcpHint = document.getElementById('hcp-hint');
  if (hcpRow && hcpHint) {
    const { course, holeCount, startHole } = readNewRoundSelection();
    hcpRow.hidden = !course;
    hcpHint.hidden = !course;
    if (course) {
      const played = course.holes.slice(startHole - 1, startHole - 1 + holeCount);
      hcpHint.textContent = played.every(h => Number.isInteger(h.index)) ? HCP_HINT : NO_INDEX_HINT;
    }
  }
}

function createRound() {
  const { course, holeCount, startHole } = readNewRoundSelection();
  const nameInput = document.getElementById('round-name');

  // Copy par, length and index so later edits to the course don't change this round.
  const holeData = {};
  if (course) {
    for (let i = 0; i < holeCount; i++) {
      const hole = course.holes[startHole - 1 + i];
      if (hole) holeData[startHole + i] = { par: hole.par, length: hole.length, index: Number.isInteger(hole.index) ? hole.index : null };
    }
  }

  let handicap = null;
  const hcpInput = document.getElementById('round-hcp');
  const allowanceSelect = document.getElementById('round-allowance');
  const allowance = allowanceSelect ? Number(allowanceSelect.value) || 100 : 100;
  const hcpDigits = hcpInput ? hcpInput.value.replace(/\D/g, '') : '';
  if (course && hcpDigits !== '') handicap = { base: parseInt(hcpDigits, 10), allowance };
  if (allowanceSelect) db.allowance = allowance;

  const round = {
    id: newId(),
    name: course ? course.name : (nameInput ? nameInput.value.trim() : ''),
    createdAt: Date.now(),
    courseId: course ? course.id : null,
    holeCount,
    startHole,
    sourceHoleCount: course ? course.holes.length : holeCount,
    currentHole: startHole,
    holeData,
    handicap,
    holes: {}
  };
  db.rounds.push(round);
  openRound(round.id);
}

/* ---------- Course editor and import ---------- */

function emptyHoles() {
  return Array.from({ length: 18 }, () => ({ par: 4, length: null, index: null }));
}

function startNewCourse() {
  draft = { id: null, name: '', count: 18, all: emptyHoles() };
  view = 'course-edit';
  render();
}

function startEditCourse(id) {
  const course = db.courses.find(c => c.id === id);
  if (!course) return;
  const all = emptyHoles();
  course.holes.forEach((h, i) => { all[i] = { par: h.par, length: h.length, index: Number.isInteger(h.index) ? h.index : null }; });
  draft = { id: course.id, name: course.name, count: course.holes.length, all };
  view = 'course-edit';
  render();
}

function saveCourse() {
  const nameInput = document.getElementById('course-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) {
    toast('Give the course a name');
    if (nameInput) nameInput.focus();
    return;
  }
  const indices = draft.all.slice(0, draft.count).map(h => h.index).filter(v => v !== null && v !== undefined);
  if (indices.some(v => !Number.isInteger(v) || v < 1 || v > 18)) {
    toast('Hole index must be between 1 and 18');
    return;
  }
  if (new Set(indices).size !== indices.length) {
    toast('Each hole index can only be used once');
    return;
  }
  const holes = draft.all.slice(0, draft.count).map(h => ({ par: h.par, length: h.length, index: h.index === undefined ? null : h.index }));
  const existing = draft.id ? db.courses.find(c => c.id === draft.id) : null;
  if (existing) {
    existing.name = name;
    existing.holes = holes;
  } else {
    db.courses.push({ id: newId(), name, holes });
  }
  saveDb();
  draft = null;
  view = 'courses';
  render();
}

function deleteCourse() {
  if (!draft || !draft.id) return;
  if (!confirm('Delete this course? Rounds you have already played keep their par and length.')) return;
  db.courses = db.courses.filter(c => c.id !== draft.id);
  saveDb();
  draft = null;
  view = 'courses';
  render();
}

function updateDraftTotals() {
  const el = document.getElementById('course-totals');
  if (el && draft) el.textContent = draftTotalsText();
}

// Validates one imported course object. Returns a course or null.
function parseCourse(item) {
  if (!item || typeof item.name !== 'string' || !item.name.trim() || !Array.isArray(item.holes)) return null;
  if (item.holes.length !== 9 && item.holes.length !== 18) return null;
  const holes = [];
  for (const h of item.holes) {
    const par = Number(h && h.par);
    if (!Number.isInteger(par) || par < PARS[0] || par > PARS[PARS.length - 1]) return null;
    let length = null;
    if (h.length !== undefined && h.length !== null && h.length !== '') {
      length = Number(h.length);
      if (!Number.isFinite(length) || length < 0 || length > 1000) return null;
      length = Math.round(length);
    }
    let index = null;
    if (h.index !== undefined && h.index !== null && h.index !== '') {
      index = Number(h.index);
      if (!Number.isInteger(index) || index < 1 || index > 18) return null;
    }
    holes.push({ par, length, index });
  }
  const used = holes.map(h => h.index).filter(v => v !== null);
  if (new Set(used).size !== used.length) return null;
  return { id: newId(), name: item.name.trim().slice(0, 60), holes };
}

function importCourses(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    toast('That is not valid JSON');
    return;
  }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.courses) ? data.courses : [data]);
  const parsed = [];
  for (const item of list) {
    const course = parseCourse(item);
    if (!course) {
      toast('Could not read the course data. Check the format.');
      return;
    }
    parsed.push(course);
  }
  if (!parsed.length) {
    toast('No courses found');
    return;
  }
  db.courses.push(...parsed);
  saveDb();
  sheet = null;
  render();
  toast(parsed.length === 1 ? 'Imported 1 course' : `Imported ${parsed.length} courses`);
}

/* ---------- Round actions ---------- */

function openRound(id) {
  roundId = id;
  cardMode = 'gross';
  view = 'round';
  sheet = null;
  db.activeRoundId = id;
  saveDb();
  startGps();
  requestWake();
  render();
}

function closeRound() {
  view = 'list';
  roundId = null;
  sheet = null;
  db.activeRoundId = null;
  saveDb();
  stopGps();
  releaseWake();
  render();
}

function addStroke() {
  const round = getRound();
  const list = holeList(round, round.currentHole);
  const fix = freshFix();
  const stroke = { t: Date.now(), club: db.club };
  if (fix) { stroke.lat = fix.lat; stroke.lng = fix.lng; stroke.acc = fix.acc; }
  list.push(stroke);
  saveDb();
  render();
  popCounter();

  // No recent fix: ask for a single position and attach it to the stroke when it arrives.
  if (!fix && 'geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(pos => {
      stroke.lat = pos.coords.latitude;
      stroke.lng = pos.coords.longitude;
      stroke.acc = pos.coords.accuracy;
      saveDb();
      if (view === 'round' && !sheet) render();
    }, () => { /* the stroke is kept, just without a position */ }, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 10000
    });
  }
}

function measureLanding() {
  const round = getRound();
  const list = holeList(round, round.currentHole);
  const stroke = list[list.length - 1];
  if (!stroke || !hasPos(stroke)) return;
  const fix = freshFix();
  if (!fix) { toast('No GPS fix yet'); return; }
  stroke.landing = { lat: fix.lat, lng: fix.lng, acc: fix.acc };
  saveDb();
  render();
}

function undoStroke() {
  const round = getRound();
  const list = holeList(round, round.currentHole);
  if (!list.length) return;
  list.pop();
  saveDb();
  render();
}

function saveHandicap() {
  const round = getRound();
  const input = document.getElementById('hcp-edit');
  const select = document.getElementById('allowance-edit');
  const digits = input ? input.value.replace(/\D/g, '') : '';
  const allowance = select ? Number(select.value) || 100 : 100;
  round.handicap = digits === '' ? null : { base: parseInt(digits, 10), allowance };
  db.allowance = allowance;
  sheet = null;
  saveDb();
  render();
}

function changeHole(delta) {
  const round = getRound();
  const first = round.startHole || 1;
  const last = first + round.holeCount - 1;
  round.currentHole = Math.max(first, Math.min(last, round.currentHole + delta));
  saveDb();
  render();
}

// Adds or removes a club from the bag. Updates the open sheet in place (no full
// re-render, so the sheet doesn't flicker); the screen behind refreshes on close.
function toggleClub(club) {
  const isActive = db.activeClubs.includes(club);
  if (isActive && db.activeClubs.length === 1) {
    toast('Keep at least one club in the bag');
    return;
  }
  db.activeClubs = CLUBS.filter(c => (c === club ? !isActive : db.activeClubs.includes(c)));
  if (!db.activeClubs.includes(db.club)) db.club = db.activeClubs[0];
  saveDb();

  app.querySelectorAll('.sheet .chip').forEach(chip => {
    const on = db.activeClubs.includes(chip.dataset.club);
    chip.classList.toggle('on', on);
    chip.setAttribute('aria-pressed', String(on));
  });
  const count = document.getElementById('bag-count');
  if (count) count.textContent = bagCountText();
}

async function exportData() {
  const text = JSON.stringify({
    exportedAt: new Date().toISOString(),
    courses: db.courses,
    rounds: db.rounds,
    activeClubs: db.activeClubs
  }, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  } catch (err) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (copyErr) { ok = false; }
    area.remove();
    toast(ok ? 'Copied to clipboard' : 'Could not copy');
  }
}

/* ---------- Event handling ---------- */

// One delegated click handler for the whole app.
app.addEventListener('click', event => {
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  const round = getRound();

  switch (action) {
    case 'new-round': sheet = { type: 'new' }; render(); break;
    case 'create-round': createRound(); break;
    case 'open-round': openRound(el.dataset.id); break;
    case 'delete-round':
      if (confirm('Delete this round? This cannot be undone.')) {
        db.rounds = db.rounds.filter(r => r.id !== el.dataset.id);
        saveDb();
        render();
      }
      break;
    case 'export': exportData(); break;

    case 'courses': view = 'courses'; render(); break;
    case 'courses-back': view = 'list'; render(); break;
    case 'new-course': startNewCourse(); break;
    case 'edit-course': startEditCourse(el.dataset.id); break;
    case 'cancel-course': draft = null; view = 'courses'; render(); break;
    case 'save-course': saveCourse(); break;
    case 'delete-course': deleteCourse(); break;
    case 'set-par': {
      const par = Number(el.dataset.par);
      draft.all[Number(el.dataset.i)].par = par;
      el.parentElement.querySelectorAll('.par-btn').forEach(btn => {
        btn.classList.toggle('on', Number(btn.dataset.par) === par);
      });
      updateDraftTotals();
      break;
    }
    case 'import-course': sheet = { type: 'import' }; render(); break;
    case 'do-import': importCourses(document.getElementById('import-text').value); break;

    case 'edit-bag': sheet = { type: 'bag' }; render(); break;
    case 'toggle-club': toggleClub(el.dataset.club); break;
    case 'back': closeRound(); break;
    case 'scorecard': view = 'card'; render(); break;
    case 'card-back': view = 'round'; render(); break;
    case 'card-mode': cardMode = el.dataset.mode === 'net' ? 'net' : 'gross'; render(); break;
    case 'edit-handicap': sheet = { type: 'handicap' }; render(); break;
    case 'save-handicap': saveHandicap(); break;
    case 'remove-handicap':
      round.handicap = null;
      sheet = null;
      saveDb();
      render();
      break;
    case 'goto-hole':
      round.currentHole = Number(el.dataset.hole);
      view = 'round';
      saveDb();
      render();
      break;
    case 'prev-hole': changeHole(-1); break;
    case 'next-hole': changeHole(1); break;
    case 'add': addStroke(); break;
    case 'undo': undoStroke(); break;
    case 'measure': measureLanding(); break;
    case 'pick-club':
      db.club = el.dataset.club;
      saveDb();
      app.querySelectorAll('.dock .chip[data-club]').forEach(chip => {
        chip.classList.toggle('on', chip.dataset.club === db.club);
      });
      break;
    case 'edit-stroke': sheet = { type: 'stroke', index: Number(el.dataset.index) }; render(); break;
    case 'set-club': {
      const list = holeList(round, round.currentHole);
      if (list[sheet.index]) list[sheet.index].club = el.dataset.club;
      sheet = null;
      saveDb();
      render();
      break;
    }
    case 'delete-stroke': {
      const list = holeList(round, round.currentHole);
      list.splice(sheet.index, 1);
      sheet = null;
      saveDb();
      render();
      break;
    }
    case 'close-sheet': sheet = null; render(); break;
  }
});

app.addEventListener('change', event => {
  const target = event.target;
  if (target.id === 'round-course') {
    // Pick the matching hole count for the chosen course.
    const course = db.courses.find(c => c.id === target.value);
    if (course) {
      const radio = document.querySelector(`input[name="holes"][value="${course.holes.length}"]`);
      if (radio) radio.checked = true;
    }
    syncNewRoundForm();
  } else if (target.name === 'holes' || target.name === 'nine') {
    syncNewRoundForm();
  } else if (target.name === 'course-count' && draft) {
    const nameInput = document.getElementById('course-name');
    if (nameInput) draft.name = nameInput.value;
    draft.count = Number(target.value);
    render();
  }
});

// Number fields in the course editor: keep digits only and update the draft as you type.
app.addEventListener('input', event => {
  const target = event.target;
  if (!draft) return;
  if (target.classList.contains('len')) {
    const digits = target.value.replace(/\D/g, '').slice(0, 4);
    if (digits !== target.value) target.value = digits;
    draft.all[Number(target.dataset.i)].length = digits ? parseInt(digits, 10) : null;
    updateDraftTotals();
  } else if (target.classList.contains('idx')) {
    const digits = target.value.replace(/\D/g, '').slice(0, 2);
    if (digits !== target.value) target.value = digits;
    draft.all[Number(target.dataset.i)].index = digits ? parseInt(digits, 10) : null;
  }
});

/* ---------- Icon (used by "Add to Home Screen") ---------- */

(function makeIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1E5233';
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = '#EDF0E6';
    ctx.fillRect(84, 34, 7, 104);
    ctx.beginPath(); ctx.ellipse(88, 142, 36, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#C4372D';
    ctx.beginPath(); ctx.moveTo(91, 34); ctx.lineTo(142, 55); ctx.lineTo(91, 76); ctx.closePath(); ctx.fill();
    const url = canvas.toDataURL('image/png');
    const touchIcon = document.createElement('link');
    touchIcon.rel = 'apple-touch-icon'; touchIcon.href = url;
    const favicon = document.createElement('link');
    favicon.rel = 'icon'; favicon.href = url;
    document.head.append(touchIcon, favicon);
  } catch (err) { /* the icon is optional */ }
})();

/* ---------- Start ---------- */

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if (db.activeRoundId && db.rounds.some(r => r.id === db.activeRoundId)) {
  openRound(db.activeRoundId);
} else {
  render();
}
</script>
