<!doctype html>
<meta charset="utf-8">
<title>Scorecard</title>
<pre id="out"></pre>
<script src="harness.js"></script>
<script>
// parseScorecard() on words recorded from Vision (tests/fixtures: rendered scorecards, one turned 2°, read by
// ios/StrokeCounter/ScorecardReader.swift), and the scan flow in the course editor with a fake iOS bridge.
const SCAN_BRIDGE = '<script>window.webkit = { messageHandlers: { scorecard: { postMessage: m => parent.posted.push(m) } } };<\/script>';
const PARS = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 5, 4, 4, 4, 3, 5, 4];
const IDX = [7, 11, 17, 1, 5, 13, 15, 3, 9, 8, 18, 2, 12, 6, 10, 16, 4, 14];
const BASE = [345, 312, 152, 478, 365, 330, 141, 388, 502, 356, 165, 490, 320, 371, 344, 128, 512, 402];
const lengths = off => BASE.map(b => Math.max(90, b + off));
const fixture = async name => (await fetch(`fixtures/${name}.json`)).json();
// How many of the expected values were read right, wrong, or not at all.
const tally = (got, want) => got.reduce((t, v, i) => (v === null ? t.missing++ : v === want[i] ? t.right++ : t.wrong++, t), { right: 0, wrong: 0, missing: 0 });

test(async () => {
  const app = await loadApp({ inject: SCAN_BRIDGE, data: { courses: [], rounds: [] } });
  const parse = pages => app.w.parseScorecard(pages);

  // One wide table: holes 1–9, UT, 10–18, IN, TOT; tees named 58/55/50/45, then Par and HCP.
  const wide = await fixture('scorecard-wide');
  let card = parse([wide]);
  ok('wide: 18 holes', card && card.count === 18);
  let par = tally(card.holes.map(h => h.par), PARS), idx = tally(card.holes.map(h => h.index), IDX);
  ok('wide: par all right', par.right === 18, JSON.stringify(par));
  ok('wide: no wrong index (Vision missed the 7 on hole 1 and the 6 on hole 14)', idx.wrong === 0 && idx.right === 16, JSON.stringify(idx));
  ok('wide: four tees with their names', card.tees.map(t => t.name).join() === '58,55,50,45', card.tees.map(t => t.name).join());
  const off = { 58: 0, 55: -20, 50: -45, 45: -70 };
  const len = card.tees.map(t => tally(t.lengths, lengths(off[t.name])));
  ok('wide: lengths right, nothing wrong', len.every(t => t.wrong === 0) && len.reduce((n, t) => n + t.right, 0) >= 68, JSON.stringify(len));

  // Two blocks (1–9 with Ut, 10–18 with In), tees Gul and Röd; Vision missed several single digits here.
  const blocks = await fixture('scorecard-blocks');
  card = parse([blocks]);
  ok('blocks: 18 holes', card && card.count === 18);
  par = tally(card.holes.map(h => h.par), PARS); idx = tally(card.holes.map(h => h.index), IDX);
  ok('blocks: no wrong par, the one missing on the front nine worked out from Ut', par.wrong === 0 && par.right === 18, JSON.stringify(par));
  ok('blocks: no wrong index', idx.wrong === 0 && idx.right >= 15, JSON.stringify(idx));
  ok('blocks: tees Gul and Röd, joined across both nines', card.tees.map(t => t.name).join() === 'Gul,Röd', card.tees.map(t => t.name).join());
  const gul = tally(card.tees[0].lengths, lengths(0)), rod = tally(card.tees[1].lengths, lengths(-60));
  ok('blocks: lengths with nothing wrong', gul.wrong === 0 && rod.wrong === 0 && gul.right === 18 && rod.right >= 16, JSON.stringify([gul, rod]));

  // The wide card turned 2°, with table lines read as | in some cells.
  card = parse([await fixture('scorecard-tilted')]);
  par = tally(card.holes.map(h => h.par), PARS);
  const tilted = card.tees.map(t => tally(t.lengths, lengths(off[t.name])));
  ok('tilted: par all right, four tees, no wrong length', par.right === 18 && card.tees.length === 4 && tilted.every(t => t.wrong === 0 && t.right === 18), JSON.stringify([par, tilted]));

  // A 9-hole loop printed as holes 19–27 down a column, tees as columns named 61…43 under "Längd i meter",
  // Par and Hcp columns, Ut at the bottom, and digits above the card (as a keyboard in a real photo).
  card = parse([await fixture('scorecard-loop')]);
  ok('loop: 9 holes, 19–27 become 1–9', card && card.count === 9);
  ok('loop: par and index all right',
    card.holes.slice(0, 9).map(h => h.par).join() === '4,4,3,4,4,5,5,3,4' && card.holes.slice(0, 9).map(h => h.index).join() === '5,13,3,15,17,11,1,9,7',
    JSON.stringify(card.holes.slice(0, 9)));
  ok('loop: tees named by their numbers, with all lengths',
    card.tees.map(t => t.name).join() === '61,57,53,48,43' && card.tees[0].lengths.slice(0, 9).join() === '380,310,190,340,320,530,570,160,380' && card.tees[4].lengths[8] === 260,
    JSON.stringify(card.tees.map(t => t.name + ':' + t.lengths.slice(0, 9).join(' '))));

  // The whole card: the loop 19–27 on the left and 1–9 on the right, played 19–27 then 1–9, so 19 becomes hole 1
  // and 1 becomes hole 10. The tees are joined across both tables.
  card = parse([await fixture('scorecard-loop18')]);
  ok('19–9: 18 holes, in the order the card shows them',
    card && card.count === 18 && card.holes.map(h => h.par).join() === '4,4,3,4,4,5,5,3,4,4,5,4,3,4,3,4,4,4',
    card && JSON.stringify(card.holes.map(h => h.par)));
  ok('19–9: index all right', card.holes.map(h => h.index).join() === '5,13,3,15,17,11,1,9,7,2,18,8,4,10,12,6,16,14');
  ok('19–9: five tees over all 18 holes',
    card.tees.map(t => t.name).join() === '61,57,53,48,43' && card.tees[0].lengths.join() === '380,310,190,340,320,530,570,160,380,355,445,380,180,325,165,340,340,355' && card.tees[4].lengths[12] === 75,
    JSON.stringify(card.tees.map(t => t.name + ':' + t.lengths.join(' '))));

  // A 6-hole par 3 course, holes down a column under "Hål": fewer than seven hole numbers count after a Hål label.
  // The app has 9 or 18 holes, so it becomes 9 with holes 7–9 left unread.
  card = parse([await fixture('scorecard-six')]);
  ok('six holes: par and index on holes 1–6, nothing on 7–9, no tees',
    card && card.count === 9 && card.holes.slice(0, 9).map(h => h.par).join() === '3,3,3,3,3,3,,,' && card.holes.slice(0, 6).map(h => h.index).join() === '2,4,3,6,5,1' && card.tees.length === 0,
    card && JSON.stringify(card));

  // The same card read downwards (hole numbers in a column) and both cards as two pages.
  const turned = { width: wide.height, height: wide.width, words: wide.words.map(w => ({ text: w.text, x: w.y, y: w.x, w: w.h, h: w.w })) };
  card = parse([turned]);
  ok('a table running downwards is read too', card && tally(card.holes.map(h => h.par), PARS).right === 18);
  ok('nothing to read: null', parse([]) === null && parse([{ width: 100, height: 100, words: [{ text: 'Hello', x: 5, y: 5, w: 20, h: 8 }] }]) === null);
  ok('junk does not throw', parse([{ words: [null, { text: 5 }, { text: '4', x: NaN }] }]) === null);

  // The flow in the editor.
  app.E("view = 'courses'; render();");
  await app.click('[data-action=new-course]');
  ok('Scan scorecard shows on a new course in the iOS app', !!app.q('[data-action=scan-scorecard]'));
  app.q('#course-name').value = 'Testbanan';
  await app.click('[data-action=scan-scorecard]');
  ok('it asks the iOS app to scan', posted.some(m => m.type === 'scan'));
  app.E("scorecardScanned({ status: 'reading' })");
  ok('while reading, a note says so', /Reading the scorecard/.test(app.q('.scan-note').textContent));
  app.E("scorecardScanned({ status: 'reading', page: 2, pages: 5 })");
  ok('with several pictures, the note says which one', /Reading the scorecard… \(2 of 5\)/.test(app.q('.scan-note').textContent));
  for (const status of ['cancelled', 'denied', 'unsupported', 'failed']) app.E(`scorecardScanned({ status: '${status}' })`);
  ok('the note goes when reading ends', !app.q('.scan-note'));
  ok('cancel, no camera access or a failure leave the course as it was', app.E('draft.tees.length === 1 && draft.all[2].par === 4 && draft.all[0].index === null && !draft.scanNote'));
  app.E("scorecardScanned({ status: 'ok', pages: [{ width: 10, height: 10, words: [] }] })");
  ok('nothing found: the course stays as it was', app.E('!draft.scanNote && draft.all[2].par === 4'));

  app.E(`scorecardScanned(${JSON.stringify({ status: 'ok', pages: [blocks] })})`);
  ok('a read card fills the editor: par, index and the tees, Gul in place of the empty Standard',
    app.E("draft.count === 18 && draft.all[2].par === 3 && draft.all[3].index === 1 && draft.tees.map(t => t.name).join() === 'Gul,Röd' && draft.tees[0].holes[0].length === 345"));
  ok('the name typed before scanning is kept', app.q('#course-name').value === 'Testbanan');
  ok('a note says what was read and asks to check', /Read from the scorecard: 18 holes/.test(app.q('.scan-note').textContent));
  const unread = app.qa('.idx.unread').map(i => Number(i.dataset.i));
  ok('unread index fields are marked', unread.length === app.E('draft.unread.index.size') && unread.every(i => app.E(`draft.all[${i}].index`) === null));
  if (unread.length) {
    const input = app.q(`.idx[data-i="${unread[0]}"]`);
    input.value = '9'; input.dispatchEvent(new app.w.Event('input', { bubbles: true }));
    ok('typing in a marked field clears the mark', !input.classList.contains('unread'));
  }
  ok('nothing is saved until Save', app.saved().courses.length === 0);
  // Make the card valid where the scan left gaps, then save.
  app.E(`draft.all.forEach((h, i) => { h.index = ${JSON.stringify(IDX)}[i]; }); draft.tees.forEach(t => t.holes.forEach((h, i) => { if (h.length === null) h.length = 100; }));`);
  await app.click('[data-action=save-course]');
  const saved = app.saved().courses[0];
  ok('Save stores the course as usual, without scan marks', saved && saved.name === 'Testbanan' && saved.tees.length === 2 && !('scanned' in saved.tees[0]) && !('unread' in saved.tees[0]) && saved.holes[2].par === 3);

  // Not offered when editing a saved course, nor in a browser.
  await app.click(`[data-action=edit-course][data-id="${saved.id}"]`);
  ok('no scan button when editing a saved course', !app.q('[data-action=scan-scorecard]'));
  const web = await loadApp({ data: { courses: [], rounds: [] } });
  web.E("view = 'courses'; render();");
  await web.click('[data-action=new-course]');
  ok('no scan button outside the iOS app', !web.q('[data-action=scan-scorecard]'));
});
</script>
