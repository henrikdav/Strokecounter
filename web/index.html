<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Strokes">
<meta name="theme-color" content="#EDF0E6">
<title>Stroke Counter</title>
<style>
  :root {
    --paper: #EDF0E6;
    --white: #FBFCF8;
    --ink: #17241B;
    --mute: #5D6B60;
    --line: #CBD2C0;
    --fairway: #1E5233;
    --fairway-deep: #143A24;
    --sand: #E3D5AC;
    --flag: #C4372D;
    --under: #24763F;
    --under-tint: #E3EEE3;   /* backgrounds of net badges on the home screen */
    --over-tint: #FBE8E6;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.35 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--fairway); outline-offset: 2px; }
  #app { height: 100%; max-width: 480px; margin: 0 auto; }

  .screen { height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-t); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; min-height: 52px; }
  .top h1, .top h2 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .top h2 { font-size: 20px; }
  .ghost { background: none; border: 0; color: var(--fairway); font-weight: 700; padding: 10px 4px; min-height: 44px; }
  .ghost.side { min-width: 64px; text-align: left; }   /* equal width on both sides keeps the title centred */
  .ghost.side.right { text-align: right; }

  .gps { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 5px 11px;
         border-radius: 999px; background: var(--white); border: 1px solid var(--line); }
  .gps::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #9AA79B; }
  .gps.good::before { background: #2E8B4E; }
  .gps.ok::before { background: #D9A21B; }
  .gps.bad::before { background: var(--flag); }
  /* Accuracy dot on a toast, e.g. after marking the hole. Same colours as the GPS status. */
  #toast[data-level]::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  #toast[data-level="good"]::before { background: #2E8B4E; }
  #toast[data-level="ok"]::before { background: #D9A21B; }
  #toast[data-level="bad"]::before { background: var(--flag); }

  /* Round screen */
  .holebar { display: flex; align-items: center; justify-content: space-between; padding: 2px 14px; }
  .step { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--fairway); background: transparent;
          color: var(--fairway); font-size: 30px; line-height: 1; font-weight: 700; padding: 0 0 4px; }
  .step:disabled { opacity: .28; }
  .holetitle { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .holetitle small { font-size: 14px; font-weight: 600; color: var(--mute); margin-left: 6px; letter-spacing: 0; }
  .holetitle { text-align: center; }
  .hole-tee { display: block; margin-top: -2px; font-size: 14px; font-weight: 700; color: var(--mute); letter-spacing: 0; }

  .counter { text-align: center; padding: 0 14px 8px; }
  .holeinfo { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; font-size: 17px; font-weight: 700; min-height: 30px; }
  /* Course map button, only in the iOS app. Looks like the GPS pill. */
  .map-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px 4px 9px; border-radius: 999px;
             border: 1px solid var(--line); background: var(--white); color: var(--fairway-deep); font-size: 14px; font-weight: 700; }
  .map-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .over { color: var(--flag); }
  .under { color: var(--under); }
  .big { font-size: 132px; font-size: clamp(76px, 15dvh, 130px); line-height: 1.02; font-weight: 800;
         letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--fairway-deep); }
  .sub { color: var(--mute); font-size: 15px; font-weight: 600; }

  .strokes { list-style: none; margin: 0; padding: 0 14px; flex: 1; min-height: 0; overflow-y: auto;
             border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
  .strokes li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  .stroke { flex: 1; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 9px 0;
            min-height: 52px; text-align: left; }
  .n { width: 30px; height: 30px; border-radius: 50%; background: var(--fairway); color: var(--white);
       display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .club { font-weight: 700; font-size: 18px; }
  .nopos { color: var(--flag); font-size: 12px; font-weight: 600; }
  .dist { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .dist.muted { color: var(--mute); font-weight: 400; }
  .measure { display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--fairway); background: none;
             color: var(--fairway-deep); border-radius: 999px; padding: 6px 16px 6px 12px; font-weight: 800; font-size: 18px;
             font-variant-numeric: tabular-nums; min-height: 44px; }
  .measure:active { background: var(--sand); }
  .stop-icon { width: 14px; height: 14px; border-radius: 3px; background: var(--flag); flex: none; }
  .hint-empty { padding: 18px 0; color: var(--mute); font-size: 15px; }

  .dock { padding: 10px 14px calc(10px + var(--safe-b)); background: var(--white); border-top: 1px solid var(--line); }
  .chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .chip { min-height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper);
          font-weight: 700; font-size: 14px; padding: 0 2px; }
  .chip.on { background: var(--sand); border-color: var(--ink); }
  .chip-bag { border-style: dashed; background: transparent; color: var(--mute); }
  .chip-penalty { border-color: var(--flag); color: var(--flag); font-weight: 800; }
  .chip-penalty.on { background: var(--flag); color: var(--white); border-color: var(--flag); }
  .mods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .modrow { margin: 0 0 10px; }
  .sheet-mods { margin: 0 0 14px; }
  .modbtn { min-height: 36px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper);
            font-weight: 700; font-size: 14px; padding: 0 2px; }
  .modbtn.on { background: var(--sand); border-color: var(--ink); }
  .modbtn:disabled { opacity: .4; cursor: default; }
  /* Round screen: a denser club grid, 6 per row, and slimmer modifier buttons to save vertical space. */
  .dock .chips { grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
  .dock .chip { min-height: 32px; border-radius: 8px; font-size: 13px; padding: 0 1px; white-space: nowrap; letter-spacing: -0.01em; }
  .dock .mods { gap: 4px; }
  .dock .modrow { margin-bottom: 8px; }
  .dock .modbtn { min-height: 30px; font-size: 13px; }
  .chiptag { font-size: 11px; font-weight: 700; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
  .actions { display: flex; gap: 10px; }
  .done { width: 88px; min-height: 76px; border-radius: 20px; border: 2px solid var(--fairway); background: var(--white);
          font-size: 20px; font-weight: 800; color: var(--fairway-deep); }
  .add { flex: 1; min-height: 76px; border-radius: 20px; border: 0; background: var(--fairway); color: var(--white);
         font-size: clamp(22px, 7.4vw, 30px); font-weight: 800; white-space: nowrap; box-shadow: 0 4px 0 var(--fairway-deep); }
  .add:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fairway-deep); }

  /* Locked hole: the controls are replaced by a slider that must be dragged all the way across. */
  .unlock-hint { margin: 0 0 10px; text-align: center; color: var(--mute); font-size: 14px; font-weight: 600; }
  .locked-row { display: flex; align-items: center; gap: 10px; }
  .locked-row .unlock-hint { flex: 1; }
  .locked-row .note-btn { width: 48px; min-height: 48px; margin-bottom: 10px; }
  /* Note button: an outlined page when empty, a filled one when the hole has a note. */
  .note-btn { width: 48px; min-height: 76px; flex: none; display: grid; place-items: center; border-radius: 16px;
              border: 2px solid var(--line); background: var(--white); color: var(--mute); }
  .note-btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .note-btn.has { border-color: var(--fairway); color: var(--fairway-deep); background: var(--sand); }
  .note-btn.has .note-page { fill: var(--white); }
  /* Mark hole button: the same outlined/filled look as the note button, filled once the hole is marked. */
  .mark-btn .pin-head { fill: none; }
  .mark-btn.has .pin-head { fill: var(--flag); }
  .hole-pin { display: inline-flex; align-items: center; gap: 4px; color: var(--fairway); }
  .hole-pin svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .hole-pin .pin-head { fill: var(--flag); }
  .stroke-note-field { margin: 0 0 14px; }
  .json-box.note-box.stroke-note-box { min-height: 70px; margin-bottom: 0; }
  .stroke-note { display: inline-grid; place-items: center; color: var(--fairway); }
  .stroke-note svg { width: 18px; height: 18px; fill: var(--sand); stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .json-box.note-box { min-height: 140px; font: inherit; font-size: 17px; line-height: 1.4; }
  .note-read { white-space: pre-wrap; margin: 0 0 12px; padding: 12px; border-radius: 12px; background: var(--paper);
               border: 2px solid var(--line); font-size: 16px; }
  .round-note { display: flex; align-items: flex-start; gap: 8px; width: calc(100% - 28px); margin: -4px 14px 10px; padding: 8px 10px;
                border: 0; border-radius: 10px; background: var(--white); color: var(--ink); text-align: left; font-size: 14px; }
  .round-note span { flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .round-note svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--fairway); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .add-note { display: block; margin: -6px 14px 8px; }
  .unlock { position: relative; height: 68px; padding: 4px; border-radius: 999px; background: var(--paper);
            border: 2px solid var(--line); touch-action: none; -webkit-user-select: none; user-select: none; }
  .unlock-label { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
                  font-size: 20px; font-weight: 800; color: var(--fairway-deep); letter-spacing: .02em; }
  .unlock-knob { position: relative; z-index: 1; display: grid; place-items: center; width: 64px; height: 56px;
                 border-radius: 999px; background: var(--fairway); color: var(--white); font-size: 30px; font-weight: 800;
                 box-shadow: 0 2px 0 var(--fairway-deep); touch-action: none; cursor: grab; }
  .unlock-knob.settle { transition: transform .25s ease-out; }
  .round-end { margin: 18px 0 8px; }
  .round-end .hint { margin-bottom: 10px; }

  /* Lists (rounds and courses) */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; -webkit-overflow-scrolling: touch; }
  .rounds { list-style: none; margin: 0; padding: 0; }
  .round-item { display: flex; gap: 6px; margin-bottom: 10px; align-items: stretch; }
  .round-open { flex: 1; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center;
                text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .rn { grid-column: 1; font-weight: 800; font-size: 18px; }
  .rm { grid-column: 1; color: var(--mute); font-size: 14px; }
  .rt { grid-column: 2; grid-row: 1 / span 2; text-align: right; color: var(--mute); font-size: 13px; font-weight: 600; }
  .rt b { display: block; font-size: 36px; line-height: 1; color: var(--fairway-deep); font-weight: 800; font-variant-numeric: tabular-nums; }
  .empty { color: var(--mute); padding: 24px 4px; font-size: 17px; }

  /* Home screen: stats, the round in progress, past rounds (swipe left to delete), settings behind the gear */
  .icon-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
              background: var(--white); border: 1px solid var(--line); color: var(--fairway); }
  .icon-btn svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stats { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 14px; padding: 14px 16px;
           background: var(--white); border: 1px solid var(--line); border-radius: 16px; }
  .stat b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat b.under { color: var(--fairway); }
  .stat b.over { color: var(--flag); }
  .stat span { font-size: 12px; font-weight: 600; color: var(--mute); }
  .continue { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin: 0 0 18px;
              padding: 16px; border: 0; border-radius: 16px; background: var(--fairway); color: var(--white); text-align: left; }
  .continue-text { min-width: 0; }
  .continue-kicker { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--sand); }
  .continue-name { display: block; margin-top: 2px; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
  .continue-meta { display: block; margin-top: 1px; font-size: 13px; color: var(--line); }
  .continue-go { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--sand); color: var(--fairway-deep);
                 font-size: 14px; font-weight: 700; }
  .past-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 6px; }
  .past-head h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .past-head span { font-size: 11px; color: var(--mute); }
  .past-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .past { position: relative; overflow: hidden; border-radius: 14px; }
  .past-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0; border-radius: 0 14px 14px 0;
              background: var(--flag); color: var(--white); font-size: 13px; font-weight: 700; }
  .past-card { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px;
               background: var(--white); border: 1px solid var(--line); border-radius: 14px; text-align: left;
               touch-action: pan-y; transition: transform .18s ease; }
  .past-card.open { transform: translateX(-88px); }
  .past-card.dragging { transition: none; }
  .past-text { flex: 1; min-width: 0; }
  .past-name { display: block; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .past-meta { display: block; margin-top: 1px; font-size: 12px; color: var(--mute); }
  .net-badge { flex: none; padding: 5px 11px; border-radius: 999px; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .net-badge.under { color: var(--fairway); background: var(--under-tint); }
  .net-badge.over { color: var(--flag); background: var(--over-tint); }
  .net-badge.neutral { padding: 4px 10px; color: var(--mute); background: var(--paper); border: 1px solid var(--line); font-size: 12px; font-weight: 700; }
  .settings-list { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; }
  .settings-item { min-height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
                   color: var(--ink); font-size: 17px; font-weight: 700; text-align: left; }
  @media (prefers-reduced-motion: reduce) { .past-card { transition: none; } }

  .primary { width: 100%; min-height: 58px; border-radius: 16px; border: 0; background: var(--fairway); color: var(--white);
             font-weight: 800; font-size: 20px; box-shadow: 0 3px 0 var(--fairway-deep); }
  .primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fairway-deep); }
  .link { width: 100%; min-height: 44px; background: none; border: 0; color: var(--mute); padding: 10px; font-weight: 600; }
  .linkrow { display: flex; gap: 8px; }
  .danger { width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid var(--flag); background: none;
            color: var(--flag); font-weight: 700; margin-top: 4px; }

  /* Bottom sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(23, 36, 27, .45); z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 480px; margin: 0 auto; background: var(--white);
           border-radius: 22px 22px 0 0; padding: 18px 16px calc(14px + var(--safe-b)); max-height: 88%; overflow-y: auto;
           animation: rise .18s ease-out; }
  .sheet.no-rise { animation: none; }
  .sheet h2 { margin: 0 0 12px; font-size: 22px; font-weight: 800; }
  .hint { margin: 0 0 8px; color: var(--mute); font-size: 14px; }
  .form-error { margin: -4px 0 12px; color: var(--flag); font-size: 14px; font-weight: 600; }
  .sheet .chips + .hint { margin: -2px 0 14px; }
  .field { display: block; }
  .field + .field { margin-top: 12px; }
  .field span { display: block; font-size: 14px; color: var(--mute); font-weight: 600; margin-bottom: 6px; }
  .field input, .field select { width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: 12px; padding: 0 12px;
                 font: inherit; font-size: 17px; background: var(--paper); color: var(--ink); }
  /* The text is 16px or more so iOS does not zoom in when the box gets focus. */
  .json-box { width: 100%; min-height: 150px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
              font: 16px/1.4 ui-monospace, Menlo, monospace; background: var(--paper); color: var(--ink); resize: vertical; }
  .seg { display: flex; gap: 8px; margin: 14px 0 0; }
  .seg + .seg { margin-top: 8px; }
  .seg + .primary, .field + .seg { margin-top: 14px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 13px 8px; border-radius: 12px; border: 2px solid var(--line);
              font-weight: 700; }
  .seg input:checked + span { background: var(--sand); border-color: var(--ink); }
  .seg input:disabled + span { opacity: .35; }
  .seg input:focus-visible + span { outline: 3px solid var(--fairway); outline-offset: 2px; }
  .sheet .primary { margin-top: 16px; }
  .export-box { min-height: 44vh; font-size: 13px; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Course editor */
  .hole-head, .hole-row { display: grid; grid-template-columns: 26px 1fr 66px 46px; gap: 8px; align-items: center; }
  .hole-head { color: var(--mute); font-size: 13px; font-weight: 600; padding: 14px 0 4px; }
  .hole-head span:first-child { text-align: center; }
  .hole-head span:nth-child(n+3) { text-align: right; }
  .hole-row { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hn { font-weight: 800; font-size: 16px; text-align: center; }
  .pars { display: flex; gap: 6px; }
  .par-btn { flex: 1; min-height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper);
             font-weight: 800; font-size: 17px; padding: 0; }
  .par-btn.on { background: var(--sand); border-color: var(--ink); }
  .len, .idx { width: 100%; min-height: 44px; border: 2px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit;
         font-size: 17px; text-align: right; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
  .totals { margin: 14px 0 0; font-weight: 700; font-size: 16px; }
  .tee-label { margin: 18px 0 6px; font-size: 14px; color: var(--mute); font-weight: 600; }
  .tee-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tee-tabs .modbtn { min-height: 38px; padding: 0 14px; }
  .tee-add { border-style: dashed; background: transparent; color: var(--mute); }
  .tee-edit { margin-top: 12px; }
  .tee-edit .inline-btn { display: block; text-align: left; }
  .inline-btn.tee-remove { color: var(--flag); }
  .hole-block { border-bottom: 1px solid var(--line); }
  .hole-block .hole-row { border-bottom: 0; }
  .tee-over { display: flex; align-items: center; gap: 10px; padding: 0 0 8px 34px; font-size: 13px; color: var(--mute); font-weight: 600; }
  .tee-over label { display: flex; align-items: center; gap: 6px; }
  .tee-over input { width: 46px; min-height: 36px; border: 2px dashed var(--line); border-radius: 8px; padding: 0 6px; font: inherit;
                    font-size: 15px; text-align: right; background: var(--paper); color: var(--ink); }
  .tee-over-hint { margin-top: 4px; }
  .delete-link { margin-top: 18px; }
  .idx { padding: 0 6px; }
  .row2 { display: flex; gap: 10px; margin-top: 12px; }
  .row2 .field { flex: 1; min-width: 0; }
  .row2 .field + .field { margin-top: 0; }
  .seg + .tee-field { margin-top: 14px; }
  .extra { border: 2px solid var(--fairway); border-radius: 999px; padding: 0 10px; font-size: 15px; color: var(--fairway-deep); }
  .pills { display: flex; align-items: center; margin: 0 14px 6px; padding: 3px; border-radius: 999px; background: var(--paper); border: 2px solid var(--line); }
  .pill { flex: 1; min-height: 38px; margin: 0; padding: 0 10px; border: 0; border-radius: 999px; background: none; font-weight: 700; color: var(--mute); }
  .pill.on { background: var(--sand); color: var(--ink); box-shadow: 0 0 3px rgba(23, 36, 27, .18); }
  .hcp-line { margin: 0 0 6px; }
  .inline-btn { background: none; border: 0; padding: 6px 0; color: var(--fairway); font-weight: 700;
                text-decoration: underline; text-underline-offset: 3px; }

  /* Scorecard */
  .score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .score th { text-align: right; font-size: 13px; color: var(--mute); font-weight: 600; padding: 8px 2px; }
  .score th:first-child, .score td:first-child { text-align: left; }
  .score td { text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; }
  .score tfoot td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--ink); font-size: 17px; }
  .score .strokes-cell { font-weight: 800; }
  .score .grp { width: 1%; white-space: nowrap; padding-left: 6px; padding-right: 2px; }
  .score .grp:first-child { padding-left: 2px; }
  .score .grp-end { border-right: 2px solid var(--line); padding-right: 6px; }
  .score tr.subtotal td { font-weight: 800; background: var(--paper); border-top: 1px solid var(--ink); }
  .score tr.nine-gap td { height: 18px; padding: 0; border-bottom: 0; }
  .score tr.expandable { cursor: pointer; }
  .score tr.expandable:focus-visible { outline: 3px solid var(--fairway); outline-offset: -3px; }
  .score tr.expandable.open td { border-bottom: 0; }
  .score tr.shot-row td { vertical-align: top; padding: 1px 2px; border-bottom: 0; font-size: 14px; font-weight: 500; color: var(--mute); text-align: left; }
  .score tr.shot-row.last td { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  /* width 0 + min-width 100% keeps the shot text from widening the table's columns; it fills whatever width they get. */
  .shot { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; padding-left: 6px; width: 0; min-width: 100%; box-sizing: border-box; }
  .shot > span { white-space: nowrap; }
  .score tr.shot-row td.shot-n { text-align: right; font-variant-numeric: tabular-nums; }
  .shot .shot-dist { margin-left: auto; font-variant-numeric: tabular-nums; }
  /* Clubs table: the three number columns share the width evenly. Shots is left-aligned so its heading,
     its count and the expanded shot lines all start at the same edge. */
  .score.clubs th:not(:first-child) { width: 22%; }
  .score.clubs th, .score.clubs td { white-space: nowrap; }
  .score.clubs th:nth-child(2), .score.clubs tr.expandable td:nth-child(2) { text-align: left; }
  .score.clubs td.club-cell { white-space: normal; }
  .club-variant { font-size: 13px; font-weight: 600; color: var(--mute); white-space: nowrap; }
  .shot.flush { padding-left: 0; }
  .longest-line { margin: 4px 0 12px; font-size: 16px; font-weight: 600; }
  .longest-line strong { font-weight: 800; }
  .longest-line span { color: var(--mute); font-size: 14px; }
  .cellbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sand); font-weight: 800; font-size: 15px; }
  .card-title { margin: 6px 0 10px; font-size: 20px; font-weight: 800; }
  .card-title small { display: block; font-size: 14px; color: var(--mute); font-weight: 600; }
  .card-head { margin: 2px 14px 10px; }
  .score-h3 { margin: 26px 0 4px; font-size: 18px; font-weight: 800; }
  .note { color: var(--mute); font-size: 13px; margin: 8px 0 0; }

  /* Pull-to-refresh indicator: slides down from the top while pulling, spins while updating. */
  #ptr { position: fixed; top: calc(var(--safe-t) - 44px); left: 50%; z-index: 40; display: flex; align-items: center; gap: 8px;
         padding: 6px; border-radius: 999px; background: var(--white); box-shadow: 0 2px 8px rgba(23, 36, 27, .2);
         transform: translate(-50%, 0); pointer-events: none; opacity: 0; font-weight: 700; font-size: 14px; color: var(--ink); }
  #ptr.settle { transition: transform .2s ease-out, opacity .2s; }
  #ptr .ptr-icon { width: 24px; height: 24px; display: grid; place-items: center; color: var(--mute); }
  #ptr.ready .ptr-icon { color: var(--fairway); }
  #ptr .ptr-label { display: none; padding-right: 6px; }
  #ptr.updating .ptr-label { display: inline; }
  #ptr.updating .ptr-icon svg { animation: ptr-spin .8s linear infinite; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
  .update-banner { display: block; width: 100%; margin: 4px 0 12px; padding: 12px 14px; border: 2px solid var(--fairway);
                   border-radius: 12px; background: var(--white); color: var(--fairway-deep); font-weight: 700; text-align: left; }
  #toast { position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 50;
           background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 999px; font-size: 15px; font-weight: 600;
           opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    #toast { transition: none; }
    #ptr.settle { transition: none; }
    .unlock-knob.settle { transition: none; }
    #ptr.updating .ptr-icon svg { animation: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript>Stroke Counter requires JavaScript.</noscript>

<script>
'use strict';

/* ---------- Data and storage ---------- */

const STORAGE_KEY = 'golf-strokes.v1';
const CLUBS = ['Driver', '3W', '5W', 'Hybrid', '4i', '5i', '6i', '7i', '8i', '9i', 'PW', 'GW', 'SW', 'LW', 'Putter'];
// Penalty is not a club: it is always offered separately, on top of the bag, and is
// excluded from distance measurement and club stats, like Putter.
const PENALTY = 'Penalty';
// Stroke modifiers. Chip and Pitch describe the swing, Bunker and Rough the lie; any combination can apply.
// Each is stored as a boolean on the stroke, e.g. { club: 'SW', bunker: true, chip: true }.
const MODS = [
  { key: 'chip', label: 'Chip' },
  { key: 'pitch', label: 'Pitch' },
  { key: 'bunker', label: 'Bunker' },
  { key: 'rough', label: 'Rough' }
];
const PARS = [3, 4, 5, 6];
const ALLOWANCES = [100, 95, 90, 85];   // handicap adjustment percentages
const HCP_HINT = 'Read it from the slope table for your tee (the 9-hole value when playing 9 holes). Adjustment is the competition percentage; keep 100% for a casual round.';
const NO_INDEX_HINT = 'This course has no hole index yet, so extra strokes will not be calculated. Add the index under My courses.';
const FIX_MAX_AGE_MS = 30000;

/*
  db = {
    courses: [{ id, name,
                holes: [{ par, index }, ...],                  // 9 or 18 holes: par and index (1-18 or null) for all tees
                tees: [{ id, name, holes: [{ length, par?, index? }, ...] }] }],  // length in meters; par/index only
                                                                // when this tee differs from the course
    rounds: [{ id, name, createdAt, holeCount, startHole, sourceHoleCount, currentHole,
               courseId,                                      // null when played without a course
               holeData: { "1": { par, length, index }, ... }, // copied from the course when the round starts
               handicap: { base, allowance } | null,           // playing handicap from the slope table + adjustment %
               holes: { "1": [stroke, ...], ... },           // keyed by real hole number (startHole ...)
               locked: [1, 2, ...],                           // holes finished with Done; their controls are locked
               lockedAt: { "1": t, ... },                     // when each hole was locked (ms), to judge late watch syncs
               finished, finishedAt,                          // finished on the scorecard: read-only until unlocked there
               tee,                                           // name of the tee played, missing for older rounds
               notes: { "3": "text" }, note,                  // optional comments per hole and for the round
               holePositions: { "3": { lat, lng, acc, t } },  // where the hole (cup) was on each hole that day, optional
               removedStrokeIds: [id, ...] }],                // deleted strokes, so a late sync from the watch cannot bring them back
    allowance: 100,            // last used handicap adjustment %
    activeClubs: [...],        // clubs in the bag, shown when adding a stroke
    club: 'Driver',            // club selected for the next stroke
    modFlags: [],              // modifiers (chip, pitch, bunker, rough) switched on for the next stroke
    activeRoundId: null,       // round that was open last time
    watchRoundId: null         // round shown on the Apple Watch: the one opened last
  }
  stroke = { id, t, club, lat, lng, acc, landing?: { lat, lng, acc }, chip?, pitch?, bunker?, rough?,  // modifiers are true when set
             note? }                                                                              // optional comment on the stroke
*/

// Turns saved (or restored) data into a db, filling in defaults. Returns null when there are no rounds to read.
function normalizeDb(data) {
  if (!data || !Array.isArray(data.rounds)) return null;
  let activeClubs = Array.isArray(data.activeClubs)
    ? CLUBS.filter(c => data.activeClubs.includes(c))
    : [...CLUBS];
  if (activeClubs.length === 0) activeClubs = [...CLUBS];
  const courses = Array.isArray(data.courses)
    ? data.courses.filter(isCourseShape)
    : [];
  return {
    courses,
    allowance: ALLOWANCES.includes(Number(data.allowance)) ? Number(data.allowance) : 100,
    rounds: data.rounds,
    activeClubs,
    club: (activeClubs.includes(data.club) || data.club === PENALTY) ? data.club : activeClubs[0],
    // Modifiers switched on for the next stroke. Older saves only had a single chip flag.
    modFlags: Array.isArray(data.modFlags)
      ? MODS.map(m => m.key).filter(k => data.modFlags.includes(k))
      : (data.chipFlag ? ['chip'] : []),
    activeRoundId: data.activeRoundId || null,
    watchRoundId: data.watchRoundId || null
  };
}

function isCourseShape(c) {
  return !!c && typeof c.name === 'string' && Array.isArray(c.holes);
}

function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const loaded = normalizeDb(JSON.parse(raw));
      if (loaded) return loaded;
    }
  } catch (err) { /* ignore and start fresh */ }
  return { courses: [], rounds: [], allowance: 100, activeClubs: [...CLUBS], club: CLUBS[0], modFlags: [], activeRoundId: null, watchRoundId: null };
}

function saveDb() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  } catch (err) {
    toast('Could not save. Storage is full or blocked.');
  }
  scheduleWatchSnapshot();
}

let db = loadDb();
let view = 'list';       // 'list' | 'round' | 'card' | 'courses' | 'course-edit'
let roundId = null;
// Where Back goes. A finished round opened from Past rounds starts on its scorecard ('list' below it), and a hole
// opened from that scorecard goes back to it. Rounds opened to play (Continue) keep round -> scorecard -> round.
let cardBackTo = 'round';   // 'round' | 'list'
let roundBackTo = 'list';   // 'list' | 'card'
let sheet = null;        // null | { type: 'new' | 'bag' | 'import' } | { type: 'stroke', index, draft? }
                         // draft = { club, mods: { chip, … }, note }: unsaved edits until Save
let draft = null;        // course being edited: { id, name, count, all: [{ par, index }] x18,
                         //   tees: [{ id, name, holes: [{ length, par, index }] x18, overrides }], teeIdx }
let cardTab = 'score';   // scorecard tab: 'score' | 'clubs'
let cardScroll = { score: 0, clubs: 0 };  // scroll position per tab, kept while switching
let cardOpen = new Set();  // hole numbers expanded to show their shots on the scorecard
let cardOpenClubs = new Set();  // club group keys, e.g. '9i (chip)', expanded to show their shots on the Clubs tab
let lastFix = null;
let gpsErrorCode = null;
let watchId = null;
let wakeLock = null;
let toastTimer = null;
let updateAvailable = false;  // a newer version of the app was found on the server

const app = document.getElementById('app');

/* ---------- Helpers ---------- */

const dateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });

function esc(value) {
  return String(value).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Every stroke has a stable id, so strokes logged on the Apple Watch can be merged by id whatever order they arrive in.
function strokeId() {
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : newId() + newId();
}

// Gives strokes saved before ids existed one. Returns true when something changed.
function migrateStrokeIds(data) {
  let changed = false;
  data.rounds.forEach(round => Object.values(round.holes || {}).forEach(list => list.forEach(stroke => {
    if (!stroke.id) { stroke.id = strokeId(); changed = true; }
  })));
  return changed;
}

function findStroke(list, id) {
  const index = list.findIndex(s => s.id === id);
  return index < 0 ? null : { stroke: list[index], index };
}

function getRound() {
  return db.rounds.find(r => r.id === roundId) || null;
}

function holeList(round, hole) {
  if (!round.holes[hole]) round.holes[hole] = [];
  return round.holes[hole];
}

// Real hole numbers played in a round, e.g. [10, 11, ..., 18] for a back nine.
function holeNumbers(round) {
  const start = round.startHole || 1;
  return Array.from({ length: round.holeCount }, (_, i) => start + i);
}

function holeInfo(round, hole) {
  return (round.holeData && round.holeData[hole]) || null;
}

// Strokes minus par for a hole, or null when nothing is played or par is unknown.
function holeToPar(round, hole) {
  const info = holeInfo(round, hole);
  const count = (round.holes[hole] || []).length;
  if (!info || !count) return null;
  return count - info.par;
}

function fmtToPar(diff) {
  if (diff === null || diff === undefined) return '–';
  if (diff === 0) return 'E';
  return diff > 0 ? '+' + diff : '−' + Math.abs(diff);
}

function toParClass(diff) {
  if (diff === null || diff === undefined || diff === 0) return '';
  return diff > 0 ? 'over' : 'under';
}

// Playing handicap after the adjustment percentage, or null when none is set.
function adjustedHandicap(round) {
  if (!round.handicap) return null;
  return Math.round(round.handicap.base * round.handicap.allowance / 100);
}

// Extra (handicap) strokes on a hole, or null when they can't be calculated
// (no handicap, or a played hole without a hole index).
// The holes played are ranked by index; with n holes and playing handicap PH,
// every hole gets floor(PH / n) strokes and the easiest-to-get ranks 1..(PH mod n) get one more.
function strokesReceived(round, hole) {
  const ph = adjustedHandicap(round);
  if (ph === null) return null;
  const numbers = holeNumbers(round);
  const indexOf = h => { const info = holeInfo(round, h); return info ? info.index : null; };
  if (numbers.some(h => !Number.isInteger(indexOf(h)))) return null;
  const ranked = [...numbers].sort((a, b) => indexOf(a) - indexOf(b));
  const rank = ranked.indexOf(hole) + 1;
  if (rank === 0) return null;
  const n = numbers.length;
  return Math.floor(ph / n) + (rank <= ph % n ? 1 : 0);
}

function allowanceOptions(selected) {
  return ALLOWANCES.map(a => `<option value="${a}"${a === selected ? ' selected' : ''}>${a}%</option>`).join('');
}

function roundTotals(round) {
  let total = 0;
  let played = 0;
  let toPar = null;
  for (const hole of holeNumbers(round)) {
    const n = (round.holes[hole] || []).length;
    total += n;
    if (n > 0) played++;
    const diff = holeToPar(round, hole);
    if (diff !== null) toPar = (toPar || 0) + diff;
  }
  return { total, played, toPar };
}

// Optional notes: one per hole (round.notes["3"]) and one for the whole round (round.note). Plain text, capped.
const NOTE_MAX = { hole: 500, round: 1500, stroke: 300 };
const NOTE_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path class="note-page" d="M5 3.5h10l4 4V20.5H5z"/><path class="note-lines" d="M8.5 11h7M8.5 14.5h7M8.5 18h4.5"/></svg>';
const PIN_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5s-6.5-6.2-6.5-11.5a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11.5-6.5 11.5z"/><circle class="pin-head" cx="12" cy="10" r="2.6"/></svg>';
// The iOS app can show a native satellite map of the hole; a normal browser has no such bridge, so the
// button only appears inside the app.
const courseMapBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.courseMap;
const MAP_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg>';

// Sends the current hole's strokes, marked hole and GPS fix to the native map. The map only reads them.
function openCourseMap() {
  const round = getRound();
  const hole = round.currentHole;
  const point = p => ({ lat: p.lat, lng: p.lng, acc: p.acc || 0 });
  const fix = freshFix();
  const pin = holePosition(round, hole);
  courseMapBridge.postMessage({
    hole,
    strokes: holeList(round, hole).map((s, i) => hasPos(s) ? { n: i + 1, club: s.club, ...point(s) } : null).filter(Boolean),
    holePosition: pin ? point(pin) : null,
    fix: fix ? point(fix) : null
  });
}

function markButton(round, hole) {
  const has = !!holePosition(round, hole);
  return `<button class="note-btn mark-btn${has ? ' has' : ''}" data-action="mark-hole" aria-label="${has ? 'Mark hole position again' : 'Mark hole position'}">${PIN_ICON}</button>`;
}

function holeNote(round, hole) {
  return (round.notes && round.notes[hole]) || '';
}
// A slide-to-confirm control: the knob must be dragged all the way across (see "Unlock slider" below).
function slider(action, label, ariaLabel) {
  return `<div class="unlock">
          <span class="unlock-label" aria-hidden="true">${label}</span>
          <span class="unlock-knob" role="slider" tabindex="0" data-slide="${action}" aria-label="${ariaLabel}"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">›</span>
        </div>`;
}

function noteButton(round, hole) {
  const has = !!holeNote(round, hole);
  return `<button class="note-btn${has ? ' has' : ''}" data-action="hole-note" aria-label="${has ? 'Note' : 'Add a note'} for hole ${hole}">${NOTE_ICON}</button>`;
}

// A round finished on the scorecard is read-only, every hole as if locked, until it is unlocked again there.
// It is no longer the round to continue; rounds without the flag are in progress.
function isFinished(round) {
  return round.finished === true;
}

// Holes finished with Done are locked: their stroke controls are replaced by an unlock slider.
function isLocked(round, hole) {
  return isFinished(round) || isHoleLocked(round, hole);
}

function isHoleLocked(round, hole) {
  return Array.isArray(round.locked) && round.locked.includes(hole);
}

function setHoleLock(round, hole, t) {
  round.locked = (Array.isArray(round.locked) ? round.locked : []).filter(h => h !== hole).concat(hole);
  round.lockedAt = Object.assign({}, round.lockedAt, { [hole]: t });
}

function clearHoleLock(round, hole) {
  round.locked = (round.locked || []).filter(h => h !== hole);
  if (round.lockedAt) delete round.lockedAt[hole];
}

// A change from the watch made at time t (ms) is refused when the round was finished or the hole was locked by
// then. A change made before but delivered after still counts, so a slow sync cannot lose a stroke that was played.
// Holes locked before lock times were kept count as locked from the start.
function refusedByLock(round, hole, t) {
  if (!Number.isFinite(t)) return isLocked(round, hole);
  if (isFinished(round) && t >= round.finishedAt) return true;
  if (!isHoleLocked(round, hole)) return false;
  const since = round.lockedAt && Number.isFinite(round.lockedAt[hole]) ? round.lockedAt[hole] : 0;
  return t >= since;
}

// Label next to the hole number: "of 18", "front 9" or "back 9".
function holeSuffix(round) {
  if ((round.startHole || 1) > 1) return 'back 9';
  if (round.holeCount === 9 && round.sourceHoleCount === 18) return 'front 9';
  return 'of ' + round.holeCount;
}

// Converts a course from the old shape ({ holes: [{ par, length, index }] }) to one with a single "Standard" tee.
// Returns true when the course was changed.
function migrateCourse(course) {
  if (Array.isArray(course.tees) && course.tees.length) return false;
  const old = course.holes;
  course.holes = old.map(h => ({ par: h.par, index: Number.isInteger(h.index) ? h.index : null }));
  course.tees = [{ id: newId(), name: 'Standard', holes: old.map(h => ({ length: Number.isFinite(h.length) ? h.length : null })) }];
  return true;
}

// The holes as played from one tee: the tee's length, and its own par/index where set, otherwise the course's.
function teeHoles(course, tee) {
  return course.holes.map((h, i) => {
    const t = (tee && tee.holes[i]) || {};
    return {
      par: Number.isInteger(t.par) ? t.par : h.par,
      length: Number.isFinite(t.length) ? t.length : null,
      index: Number.isInteger(t.index) ? t.index : (Number.isInteger(h.index) ? h.index : null)
    };
  });
}

function courseTotals(holes) {
  return {
    par: holes.reduce((sum, h) => sum + h.par, 0),
    meters: holes.reduce((sum, h) => sum + (h.length || 0), 0)
  };
}

function fmtMeters(m) {
  return m.toLocaleString('en-GB') + ' m';
}

function hasPos(p) {
  return !!p && typeof p.lat === 'number' && typeof p.lng === 'number';
}

// Great-circle distance in meters (haversine formula).
function meters(a, b) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad;
  const dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Distance for stroke i: from the stroke position to the manually measured
// landing spot, otherwise to the position of the next stroke on the same hole.
function shotDistance(list, i) {
  const stroke = list[i];
  if (!stroke || stroke.club === 'Putter' || stroke.club === PENALTY || !hasPos(stroke)) return null;
  const end = hasPos(stroke.landing) ? stroke.landing : (hasPos(list[i + 1]) ? list[i + 1] : null);
  if (!end) return null;
  return { m: meters(stroke, end), approx: (stroke.acc || 0) + (end.acc || 0) > 25 };
}

// Where the hole (cup) was marked on a hole of this round, or null. Pin placements change daily, so this is
// round data, not course data.
function holePosition(round, hole) {
  const p = round.holePositions && round.holePositions[hole];
  return hasPos(p) ? p : null;
}

// Distance from stroke i's own position to the marked hole. Null for Putter and Penalty, like shotDistance.
function distanceToHole(list, i, holePos) {
  const stroke = list[i];
  if (!stroke || stroke.club === 'Putter' || stroke.club === PENALTY || !hasPos(stroke) || !hasPos(holePos)) return null;
  return { m: meters(stroke, holePos), approx: (stroke.acc || 0) + (holePos.acc || 0) > 25 };
}

// GPS accuracy as good / ok / bad, used by the status pill and the mark-hole confirmation.
function accuracyClass(acc) {
  return acc <= 10 ? 'good' : (acc <= 25 ? 'ok' : 'bad');
}

function fmtDist(d) {
  if (!d) return '';
  const m = Math.round(d.m);
  return (d.approx ? '≈ ' : '') + (m < 1 ? '<1' : m) + ' m';
}

function roundLabel(round) {
  return round.name || dateFmt.format(round.createdAt);
}

function toast(message, level) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = message;
  if (level) el.dataset.level = level; else delete el.dataset.level;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- GPS and screen wake lock ---------- */

function onFix(pos) {
  gpsErrorCode = null;
  lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, t: Date.now() };
  updateGps();
  updateLiveDistance();
}

// Updates the running distance on the measure button (last stroke of the hole)
// from the stroke position to the current GPS position.
function updateLiveDistance() {
  const el = document.getElementById('live-dist');
  if (!el || view !== 'round') return;
  const round = getRound();
  if (!round) return;
  const list = holeList(round, round.currentHole);
  const stroke = list[list.length - 1];
  const fix = freshFix();
  if (!stroke || !hasPos(stroke) || !fix) { el.textContent = '…'; return; }
  el.textContent = fmtDist({
    m: meters(stroke, fix),
    approx: (stroke.acc || 0) + (fix.acc || 0) > 25
  });
}

function onGpsError(err) {
  gpsErrorCode = err.code;
  // A denied watch is dead (iOS also reports this spuriously after resuming from the background), so clear it and
  // let the next startGps() create a new one. Unavailable and timeout keep the watch running: it retries itself.
  if (err.code === 1) stopGps();
  updateGps();
}

function startGps() {
  if (!('geolocation' in navigator) || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError, {
    enableHighAccuracy: true, maximumAge: 0, timeout: 30000
  });
}

function stopGps() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
}

function freshFix() {
  return lastFix && Date.now() - lastFix.t < FIX_MAX_AGE_MS ? lastFix : null;
}

function updateGps() {
  const el = document.getElementById('gps');
  if (!el) return;
  let cls = 'wait';
  let text = 'Searching GPS…';
  if (!('geolocation' in navigator)) {
    cls = 'bad'; text = 'No GPS';
  } else if (gpsErrorCode === 1) {
    cls = 'bad'; text = 'Location access denied';
  } else if (freshFix()) {
    const acc = Math.round(lastFix.acc);
    cls = accuracyClass(acc);
    text = 'GPS ±' + acc + ' m';
  }
  el.className = 'gps ' + cls;
  el.textContent = text;
}

async function requestWake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) { wakeLock = null; }
}

function releaseWake() {
  try { if (wakeLock) wakeLock.release(); } catch (err) { /* nothing to do */ }
  wakeLock = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (view === 'round' || view === 'card') && getRound() && !isFinished(getRound())) {
    // Always start a fresh watch on return: a watch that survived the background may no longer deliver fixes.
    stopGps();
    startGps();
    requestWake();
  }
});
setInterval(() => { updateGps(); updateLiveDistance(); }, 5000);

/* ---------- Rendering ---------- */

// Renders a grid of club buttons. `clubs` is the list to show, `active` the highlighted one.
// Groups a shot for the Clubs tab. Chip, pitch and bunker shots change how far a club goes, so each gets its
// own row, e.g. "SW (chip, bunker)". Rough is shown on the individual shots instead of splitting rows further.
function clubGroup(stroke) {
  const parts = ['chip', 'pitch', 'bunker'].filter(k => stroke[k]);
  return {
    key: stroke.club + (parts.length ? ` (${parts.join(', ')})` : ''),
    variant: parts.join(', '),
    rank: (stroke.chip ? 1 : 0) + (stroke.pitch ? 2 : 0) + (stroke.bunker ? 4 : 0)
  };
}

// Small tags for a stroke's modifiers, e.g. "bunker" and "chip", in the stroke list and scorecard.
function modTags(stroke) {
  return MODS.filter(m => stroke[m.key]).map(m => `<span class="chiptag">${m.key}</span>`).join('');
}

// A row of toggle buttons for the modifiers; `isOn(key)` says which are active.
// `disabled` greys them out in place (e.g. while Penalty is selected) so the layout does not jump.
function modsHtml(isOn, action, disabled = false) {
  return `<div class="mods" role="group" aria-label="Shot type and lie">${MODS.map(m => {
    const on = isOn(m.key);
    return `<button class="modbtn${on ? ' on' : ''}" data-action="${action}" data-mod="${m.key}" aria-pressed="${on}"${disabled ? ' disabled' : ''}>${m.label}</button>`;
  }).join('')}</div>`;
}

function chipsHtml(clubs, active, action) {
  return clubs.map(c =>
    `<button class="chip${c === active ? ' on' : ''}" data-action="${action}" data-club="${c}">${c}</button>`
  ).join('');
}

/* ---------- Home screen ---------- */

const shortDateFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
const GEAR_ICON = '<svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.63.82 1.1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
let openRowId = null;   // past round slid open to show its Delete button

// Net to par over a round's played holes, from the same hole results the scorecard uses. Null when the round has
// no playing handicap and hole index, so there is no net to show.
function roundNet(round) {
  if (strokesReceived(round, round.startHole || 1) === null) return null;
  return sumScores(holeNumbers(round).map(h => holeScore(round, h, true))).net;
}

// The round's own name, else its course's, else its date.
function roundTitle(round) {
  const course = round.courseId ? db.courses.find(c => c.id === round.courseId) : null;
  return round.name || (course && course.name) || dateFmt.format(round.createdAt);
}

function relativeDay(t) {
  const start = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((start(new Date()) - start(new Date(t))) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days > 1 && days < 7) return `${days} days ago`;
  return shortDateFmt.format(t);
}

function holesText(round, played) {
  return played === round.holeCount ? `${round.holeCount} holes` : `${played} of ${round.holeCount} holes`;
}

// One decimal for averages: "−1.2", "+0.5", "E".
function fmtAvgToPar(v) {
  if (v === null) return '–';
  const r = Math.round(v * 10) / 10;
  if (r === 0) return 'E';
  return (r > 0 ? '+' : '−') + Math.abs(r).toFixed(1);
}

// Stats over finished rounds: how many were played this calendar month, and the average and best net to par of
// those with a net result (playing handicap and hole index). Rounds without one count only in the first number.
function homeStats(finished) {
  const now = new Date();
  const month = finished.filter(r => {
    const d = new Date(r.createdAt);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
  const nets = finished.map(roundNet).filter(n => n !== null);
  return {
    month,
    avg: nets.length ? nets.reduce((a, b) => a + b, 0) / nets.length : null,
    best: nets.length ? Math.min(...nets) : null
  };
}

function netBadge(net) {
  if (net === null) return '';
  return `<span class="net-badge ${net > 0 ? 'over' : 'under'}" aria-label="Net ${fmtToPar(net)}">${fmtToPar(net)}</span>`;
}

function renderList() {
  const rounds = [...db.rounds].sort((a, b) => b.createdAt - a.createdAt);
  // The newest round not finished is the one to continue. Older unfinished rounds (rounds from before rounds
  // could be finished, say) stay in the list below, marked as not finished, so nothing disappears.
  const current = rounds.find(r => !isFinished(r)) || null;
  const past = rounds.filter(r => r !== current);
  const stats = homeStats(rounds.filter(isFinished));
  if (openRowId && !past.some(r => r.id === openRowId)) openRowId = null;

  const statsHtml = `
        <div class="stats">
          <div class="stat"><b>${stats.month}</b><span>${stats.month === 1 ? 'round' : 'rounds'} this month</span></div>
          <div class="stat"><b class="${stats.avg === null ? '' : toParClass(Math.round(stats.avg * 10) / 10)}">${fmtAvgToPar(stats.avg)}</b><span>avg net to par</span></div>
          <div class="stat"><b class="${toParClass(stats.best)}">${fmtToPar(stats.best)}</b><span>best net to par</span></div>
        </div>`;

  let currentHtml = '';
  if (current) {
    const { played } = roundTotals(current);
    const started = relativeDay(current.createdAt) === 'Today'
      ? timeFmt.format(current.createdAt)
      : `${relativeDay(current.createdAt).toLowerCase()} ${timeFmt.format(current.createdAt)}`;
    currentHtml = `
        <button class="continue" data-action="open-round" data-id="${esc(current.id)}">
          <span class="continue-text">
            <span class="continue-kicker">In progress · hole ${current.currentHole}</span>
            <span class="continue-name">${esc(roundTitle(current))}</span>
            <span class="continue-meta">Started ${esc(started)} · ${played} of ${current.holeCount} holes</span>
          </span>
          <span class="continue-go" aria-hidden="true">Continue</span>
        </button>`;
  }

  const items = past.map(r => {
    const { total, played } = roundTotals(r);
    const badge = isFinished(r) ? netBadge(roundNet(r)) : '<span class="net-badge neutral">Not finished</span>';
    const open = r.id === openRowId;
    return `
          <li class="past">
            <button class="past-del" data-action="delete-round" data-id="${esc(r.id)}" aria-label="Delete round ${esc(roundTitle(r))}">Delete</button>
            <button class="past-card${open ? ' open' : ''}" data-action="open-past" data-id="${esc(r.id)}">
              <span class="past-text">
                <span class="past-name">${esc(roundTitle(r))}</span>
                <span class="past-meta">${esc(relativeDay(r.createdAt))} · ${holesText(r, played)} · ${total} ${total === 1 ? 'stroke' : 'strokes'}</span>
              </span>
              ${badge}
            </button>
          </li>`;
  }).join('');

  return `
    <div class="screen">
      <header class="top">
        <h1>Stroke Counter</h1>
        <button class="icon-btn" data-action="settings" aria-label="Settings">${GEAR_ICON}</button>
      </header>
      <main class="scroll">
        ${updateAvailable ? '<button class="update-banner" data-action="hard-reload">A new version is available. Tap to update.</button>' : ''}
        ${statsHtml}
        ${currentHtml}
        ${past.length ? `
        <div class="past-head"><h2>Past rounds</h2><span>Swipe left to delete</span></div>
        <ul class="past-list">${items}</ul>` : ''}
        ${rounds.length ? '' : `<p class="empty">No rounds yet. Start a new one when you're on the first tee.</p>`}
      </main>
      <footer class="dock">
        <button class="primary" data-action="new-round">New round</button>
      </footer>
    </div>`;
}

function renderCourses() {
  const courses = [...db.courses].sort((a, b) => a.name.localeCompare(b.name));
  const items = courses.map(c => {
    const totals = courseTotals(teeHoles(c, c.tees[0]));
    const teeText = c.tees.length === 1 ? (totals.meters ? ', ' + fmtMeters(totals.meters) : '') : `, ${c.tees.map(t => t.name).join(', ')}`;
    return `
      <li class="round-item">
        <button class="round-open" data-action="edit-course" data-id="${esc(c.id)}">
          <span class="rn">${esc(c.name)}</span>
          <span class="rm">${c.holes.length} holes${esc(teeText)}</span>
          <span class="rt"><b>${totals.par}</b>par</span>
        </button>
      </li>`;
  }).join('');

  return `
    <div class="screen">
      <header class="top">
        <button class="ghost" data-action="courses-back">‹ Back</button>
        <h2>My courses</h2>
        <span style="width:64px"></span>
      </header>
      <main class="scroll">
        ${courses.length

        <button class="primary" data-action="new-course">New course</button>
        <button class="link" data-action="import-course">Import from JSON</button>

}

// Totals for the tee being edited, using its own par where it has one.
function draftTotalsText() {
  const tee = draft.tees[draft.teeIdx];
  const holes = draft.all.slice(0, draft.count).map((h, i) => ({
    par: Number.isInteger(tee.holes[i].par) ? tee.holes[i].par : h.par,
    length: tee.holes[i].length
  }));
  const totals = courseTotals(holes);
  return `${tee.name || 'This tee'}: par ${totals.par}` + (totals.meters ? ', ' + fmtMeters(totals.meters) : '');
}

function renderRound() {
  const round = getRound();
  const hole = round.currentHole;
  const firstHole = round.startHole || 1;
  const lastHole = firstHole + round.holeCount - 1;
  const list = holeList(round, hole);
  const totals = roundTotals(round);
  const info = holeInfo(round, hole);
  const extra = strokesReceived(round, hole);
  const last = list.length - 1;

  // A locked hole shows its strokes read-only; unlock it to change them.
  const locked = isLocked(round, hole);
  const rows = list.map((s, i) => {
    const d = shotDistance(list, i);
    let right;
    if (s.club === 'Putter' || s.club === PENALTY) {
      right = '<span class="dist muted">–</span>';
    } else if (d) {
      right = `<span class="dist">${fmtDist(d)}</span>`;
    } else if (i === last && hasPos(s) && !locked) {
      // Live measurement: shows the distance from this stroke to where you stand now.
      // Tapping it stops the measurement and locks the distance.
      right = `<button class="measure" data-action="measure" aria-label="Stop and lock this distance">
                 <span class="stop-icon" aria-hidden="true"></span>
                 <span id="live-dist">…</span>
               </button>`;
    } else {
      right = '<span class="dist muted">–</span>';
    }
    return `
      <li>
        ${(() => {
          // On a locked hole only strokes with a comment can be opened, to read it.
          const action = !locked ? 'edit-stroke' : (s.note ? 'view-stroke' : '');
          const tag = action ? 'button' : 'div';
          return `<${tag} class="stroke"${action ? ` data-action="${action}" data-id="${esc(s.id)}"` : ''}>
          <span class="n">${i + 1}</span>
          <span class="club">${esc(s.club)}</span>
          ${modTags(s)}
          ${s.note ? `<span class="stroke-note" role="img" aria-label="Has a comment">${NOTE_ICON}</span>` : ''}
          ${hasPos(s) ? '' : '<span class="nopos">no position</span>'}
        </${tag}>`;
        })()}
        ${right}
      </li>`;
  }).join('');

  const pin = holePosition(round, hole);
  const pinHtml = pin
    ? `<span class="hole-pin" role="img" aria-label="Hole marked, ±${Math.round(pin.acc)} m">${PIN_ICON}±${Math.round(pin.acc)} m</span>`
    : '';
  const infoHtml = `<div class="holeinfo">
         ${info ? `<span>Par ${info.par}</span>
         ${info.length ? `<span>${info.length} m</span>` : ''}
         ${Number.isInteger(info.index) ? `<span>Index ${info.index}</span>` : ''}
         ${extra ? `<span class="extra">${extra} extra</span>` : ''}` : ''}
         ${pinHtml}
         ${courseMapBridge ? `<button class="map-btn" data-action="course-map">${MAP_ICON}Map</button>` : ''}
       </div>`;
  const roundPart = totals.toPar === null ? '' : `, ${fmtToPar(totals.toPar)} to par`;

  return `
    <div class="screen">
      <header class="top">
        <button class="ghost" data-action="back">${roundBackTo === 'card' ? '‹ Scorecard' : '‹ Home'}</button>
        <div class="gps wait" id="gps">Searching GPS…</div>
        <button class="ghost" data-action="scorecard">Scorecard</button>
      </header>
      <div class="holebar">
        <button class="step" data-action="prev-hole" ${hole <= firstHole ? 'disabled' : ''} aria-label="Previous hole">‹</button>
        <div class="holetitle">Hole ${hole}<small>${holeSuffix(round)}</small>${round.tee ? `<span class="hole-tee">${esc(round.tee)} tee</span>` : ''}</div>
        <button class="step" data-action="next-hole" ${hole >= lastHole ? 'disabled' : ''} aria-label="Next hole">›</button>
      </div>
      <section class="counter" aria-live="polite">
        ${infoHtml}
        <div class="big">${list.length}</div>
        <div class="sub">strokes on this hole, ${totals.total} in the round${roundPart}</div>
      </section>
      <ol class="strokes">
        ${rows || '<li class="hint-empty">Tap +1 stroke right after each shot, while you are still standing where you hit from. Distance is measured to your next stroke.</li>'}
      </ol>
      ${isFinished(round) ? `
      <footer class="dock">
        <div class="locked-row">
          <p class="unlock-hint">This round is finished. Slide to unlock it if you need to change anything.</p>
          ${holeNote(round, hole) ? noteButton(round, hole) : ''}
        </div>
        ${slider('unlock-round', 'Unlock round', 'Slide all the way to unlock the round')}
      </footer>` : locked ? `
      <footer class="dock">
        <div class="locked-row">
          <p class="unlock-hint">Hole ${hole} is done and locked. Slide to unlock if you need to change a stroke${holeNote(round, hole) ? ' or the note' : ''}.</p>
          ${holeNote(round, hole) ? noteButton(round, hole) : ''}
        </div>
        ${slider('unlock-hole', 'Unlock', `Slide all the way to unlock hole ${hole}`)}
      </footer>` : `
      <footer class="dock">
        <div class="chips">
          ${chipsHtml(db.activeClubs, db.club, 'pick-club')}
          <button class="chip chip-penalty${db.club === PENALTY ? ' on' : ''}" data-action="pick-club" data-club="${PENALTY}">Penalty</button>
          <button class="chip chip-bag" data-action="edit-bag">Bag</button>
        </div>
        <div class="modrow">${modsHtml(k => db.modFlags.includes(k), 'toggle-mod-flag', db.club === PENALTY)}</div>
        <div class="actions">
          <button class="add" data-action="add">+1 stroke</button>
          ${noteButton(round, hole)}
          ${markButton(round, hole)}
          <button class="done" data-action="done-hole">Done</button>
        </div>
      </footer>`}
    </div>`;
}

const exportDateFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

// A plain-text recap of the whole round for pasting into an AI or sharing: header, each hole with its strokes
// (club, modifiers, distance, and distance to the hole when the hole was marked),
// then OUT/IN/Total. No GPS positions or times. Null when nothing is logged yet.
function roundExportText(round) {
  const numbers = holeNumbers(round);
  const hasNotes = !!round.note || numbers.some(h => holeNote(round, h));
  if (!hasNotes && !numbers.some(h => (round.holes[h] || []).length)) return null;
  const hasInfo = !!round.holeData && Object.keys(round.holeData).length > 0;
  const hasExtras = strokesReceived(round, round.startHole || 1) !== null;
  const scores = numbers.map(h => holeScore(round, h, hasExtras));
  const played = scores.filter(r => r.played).length;
  const course = round.courseId ? db.courses.find(c => c.id === round.courseId) : null;

  // An unnamed round is labelled by its date, which already has its own line.
  const lines = round.name ? [`Round: ${round.name}`] : [];
  if (course && course.name !== round.name) lines.push(`Course: ${course.name}`);
  if (round.tee) lines.push(`Tee: ${round.tee}`);
  lines.push(`Date: ${exportDateFmt.format(round.createdAt)}`);
  const suffix = holeSuffix(round);
  lines.push(`Holes: ${round.holeCount}${suffix.startsWith('of') ? '' : ` (${suffix})`}, ${played} played`);
  // Only the handicap actually used for extra strokes (after the allowance %), labelled with the holes it covers.
  if (round.handicap) lines.push(`Playing Handicap (${round.holeCount}H): ${adjustedHandicap(round)}`);
  if (round.note) lines.push(`Round note: ${round.note.replace(/\s*\n\s*/g, ' / ')}`);
  lines.push('');

  // "+1 gross, −1 net, 3 points" (only the parts that can be worked out)
  const results = r => [
    r.diff !== null ? `${fmtToPar(r.diff)} gross` : null,
    r.net !== null ? `${fmtToPar(r.net)} net` : null,
    r.points !== null ? `${r.points} ${r.points === 1 ? 'point' : 'points'}` : null
  ].filter(Boolean).join(', ');

  // Played holes, plus unplayed holes that have a note.
  scores.filter(r => r.played || holeNote(round, r.h)).forEach(r => {
    const head = [`Hole ${r.h}`];
    if (r.info) {
      head.push(`Par ${r.info.par}`);
      if (Number.isInteger(r.info.index)) head.push(`Index ${r.info.index}`);
      if (r.info.length) head.push(`${r.info.length} m`);
    }
    if (r.extra) head.push(`${r.extra} extra ${r.extra === 1 ? 'stroke' : 'strokes'}`);
    lines.push(head.join(' · '));
    const note = holeNote(round, r.h);
    if (!r.played) { lines.push('  Not played', `  Note: ${note.replace(/\s*\n\s*/g, ' / ')}`, ''); return; }
    const res = results(r);
    const pin = holePosition(round, r.h);
    lines.push(`  ${r.shown} ${r.shown === 1 ? 'stroke' : 'strokes'}${res ? ` (${res})` : ''}${pin ? `, hole marked (±${Math.round(pin.acc)} m)` : ''}`);
    r.list.forEach((stroke, i) => {
      const mods = MODS.filter(m => stroke[m.key]).map(m => m.key);
      const d = shotDistance(r.list, i);
      const label = stroke.club === PENALTY ? 'Penalty stroke' : stroke.club;
      const toHole = distanceToHole(r.list, i, pin);
      const pinPart = toHole ? ` · ${fmtDist(toHole)} to hole` : '';
      const comment = stroke.note ? ` · Comment: ${stroke.note.replace(/\s*\n\s*/g, ' / ')}` : '';
      lines.push(`  ${i + 1}. ${label}${mods.length ? ` (${mods.join(', ')})` : ''}${d ? ` – ${fmtDist(d)}` : ''}${pinPart}${comment}`);
    });
    if (note) lines.push(`  Note: ${note.replace(/\s*\n\s*/g, ' / ')}`);
    lines.push('');
  });

  // Unplayed holes on one line, with runs shortened: "Not played: holes 4–9, 12".
  const unplayed = scores.filter(r => !r.played && !holeNote(round, r.h)).map(r => r.h);
  if (unplayed.length) {
    const runs = [];
    unplayed.forEach(h => {
      const last = runs[runs.length - 1];
      if (last && h === last[1] + 1) last[1] = h; else runs.push([h, h]);
    });
    lines.push(`Not played: ${unplayed.length === 1 ? 'hole' : 'holes'} ${runs.map(([a, b]) => a === b ? a : `${a}–${b}`).join(', ')}`, '');
  }

  // Totals only count the holes played, so par is the par of those holes too.
  const totalLine = (label, list) => {
    const playedList = list.filter(r => r.played);
    if (!playedList.length) return `${label}: not played`;
    const t = sumScores(playedList);
    const holesPart = playedList.length < list.length ? `${playedList.length} of ${list.length} holes` : null;
    const parts = [holesPart, hasInfo ? `par ${t.par}` : null, results(t) || null].filter(Boolean);
    return `${label}: ${t.strokes} strokes${parts.length ? ` (${parts.join(', ')})` : ''}`;
  };
  lines.push('Totals');
  if (round.holeCount === 18) {
    lines.push(totalLine('OUT', scores.slice(0, 9)));
    lines.push(totalLine('IN', scores.slice(9, 18)));
  }
  lines.push(totalLine('Total', scores));
  const penalties = scores.reduce((n, r) => n + r.list.filter(st => st.club === PENALTY).length, 0);
  if (penalties) lines.push(`Penalty strokes: ${penalties}`);
  if (hasInfo) lines.push('', 'Gross is strokes compared with par. Net is the same after handicap extra strokes. Points are Stableford. Distances are GPS measurements from each stroke to the next; ≈ means low GPS accuracy.');
  return lines.join('\n');
}

// One hole's result: strokes, gross (to par), net (after extra strokes) and Stableford points.
// Values that can't be worked out (hole not played, no par, no handicap) are null.
function holeScore(round, h, hasExtras) {
  const list = round.holes[h] || [];
  const info = holeInfo(round, h);
  const extra = hasExtras ? strokesReceived(round, h) : null;
  const played = list.length > 0;
  const shown = played ? list.length : null;
  const diff = info && played ? shown - info.par : null;
  // Stableford: 2 points for net par, +1 per stroke better, -1 per stroke worse, never below 0.
  const points = hasExtras && info && played ? Math.max(0, 2 + info.par - (shown - extra)) : null;
  // Net: strokes minus handicap strokes, compared with par, capped at net double bogey (+2) as the handicap rules
  // do. Strokes beyond that don't count against net; the gross result and the stroke count stay as played.
  const net = hasExtras && info && played ? Math.min(shown - extra - info.par, 2) : null;
  return { h, list, info, extra, played, shown, diff, net, points };
}

// Adds up hole results for OUT, IN and Total.
function sumScores(list) {
  let par = 0, extra = 0, strokes = 0, diff = null, net = null, points = null, any = false;
  list.forEach(r => {
    if (r.info) par += r.info.par;
    if (r.extra) extra += r.extra;
    if (r.played) { strokes += r.shown; any = true; }
    if (r.diff !== null) diff = (diff || 0) + r.diff;
    if (r.net !== null) net = (net || 0) + r.net;
    if (r.points !== null) points = (points || 0) + r.points;
  });
  return { par, extra, strokes: any ? strokes : null, diff, net, points };
}

function renderCard() {
  const round = getRound();
  const hasInfo = !!round.holeData && Object.keys(round.holeData).length > 0;
  const hasExtras = strokesReceived(round, round.startHole || 1) !== null;
  const clubStats = {};
  let longestAll = null;
  let penaltyCount = 0;

  // Compute each hole's numbers first, so OUT/IN subtotal rows can be inserted
  // between the front and back nine without a second pass over the strokes.
  const perHole = holeNumbers(round).map(h => {
    const score = holeScore(round, h, hasExtras);
    const { list } = score;
    list.forEach((s, i) => {
      if (s.club === PENALTY) penaltyCount++;
      if (s.club === PENALTY || s.club === 'Putter') return;
      // Every shot counts for its club; only shots with a measured distance count for Avg and Longest.
      const d = shotDistance(list, i);
      const { key, variant, rank } = clubGroup(s);
      const st = clubStats[key] || (clubStats[key] = { club: s.club, variant, rank, n: 0, measured: 0, sum: 0, max: 0, shots: [] });
      st.n++;
      st.shots.push({ h, n: i + 1, d, rough: !!s.rough });
      if (!d) return;
      st.measured++; st.sum += d.m; st.max = Math.max(st.max, d.m);
      if (!longestAll || d.m > longestAll.d.m) longestAll = { d, key, h };
    });
    return score;
  });

  // Gross and Net are strokes over or under par, before and after handicap strokes; Points is Stableford.
  function resultCells(r) {
    return `<td class="${toParClass(r.diff)}">${fmtToPar(r.diff)}</td>
        <td class="${toParClass(r.net)}">${fmtToPar(r.net)}</td>
        <td>${r.points === null ? '–' : r.points}</td>`;
  }

  // Shot-by-shot detail under an expanded hole, one light sub-row per shot: the hole length across Hole, Par
  // and Index (so it never widens the Hole column),
  // the shot number right-aligned under Strokes, and club, chip tag and distance across the result columns.
  function shotsRow(r) {
    return r.list.map((s, i) => {
      const d = shotDistance(r.list, i);
      const holeLength = i === 0 && r.info && r.info.length ? `${r.info.length} m` : '';
      const shot = `<span>${esc(s.club)}</span>${modTags(s)}${d ? `<span class="shot-dist">${fmtDist(d)}</span>` : ''}`;
      return `
      <tr class="shot-row${i === r.list.length - 1 ? ' last' : ''}">
        ${hasInfo ? `<td colspan="3" class="grp-end">${holeLength}</td>` : `<td>${holeLength}</td>`}
        ${hasExtras ? '<td></td>' : ''}
        ${hasInfo
          ? `<td class="shot-n">${i + 1}</td><td colspan="3"><div class="shot">${shot}</div></td>`
          : `<td><div class="shot"><span>${i + 1}</span>${shot}</div></td>`}
      </tr>`;
    }).join('');
  }

  // Rows with strokes expand to show their shots; the hole button still jumps to the hole.
  function holeRow(r) {
    const open = r.played && cardOpen.has(r.h);
    const toggle = r.played
      ? ` class="expandable${open ? ' open' : ''}" data-action="toggle-hole" data-hole="${r.h}" tabindex="0" aria-expanded="${open}" aria-label="Hole ${r.h}, ${open ? 'hide' : 'show'} shots"`
      : '';
    return `
      <tr${toggle}>
        <td class="grp"><button class="cellbtn" data-action="goto-hole" data-hole="${r.h}" aria-label="Go to hole ${r.h}">${r.h}</button></td>
        ${hasInfo ? `<td class="grp">${r.info ? r.info.par : '–'}</td><td class="grp grp-end">${r.info && Number.isInteger(r.info.index) ? r.info.index : '–'}</td>` : ''}
        ${hasExtras ? `<td>${r.extra || '–'}</td>` : ''}
        <td class="strokes-cell">${r.shown === null ? '–' : r.shown}</td>
        ${hasInfo ? resultCells(r) : ''}
      </tr>${open ? shotsRow(r) : ''}`;
  }

  function subtotalRow(label, sub) {
    return `
      <tr class="subtotal">
        <td class="grp">${label}</td>
        ${hasInfo ? `<td class="grp">${sub.par}</td><td class="grp grp-end">–</td>` : ''}
        ${hasExtras ? `<td>${sub.extra || '–'}</td>` : ''}
        <td class="strokes-cell">${sub.strokes === null ? '–' : sub.strokes}</td>
        ${hasInfo ? resultCells(sub) : ''}
      </tr>`;
  }

  const headCells = `
            <th class="grp">Hole</th>
            ${hasInfo ? '<th class="grp">Par</th><th class="grp grp-end">Index</th>' : ''}
            ${hasExtras ? '<th>Extra</th>' : ''}
            <th>Strokes</th>
            ${hasInfo ? '<th>Gross</th><th>Net</th><th>Points</th>' : ''}`;
  const columnCount = 2 + (hasInfo ? 5 : 0) + (hasExtras ? 1 : 0);

  // A full 18-hole round gets a real scorecard shape: front nine, OUT, back nine, IN, then Total.
  // The back nine repeats the column headings after a small gap, like a paper scorecard.
  let rows = '';
  if (round.holeCount === 18) {
    const front = perHole.slice(0, 9);
    const back = perHole.slice(9, 18);
    rows += front.map(holeRow).join('') + subtotalRow('OUT', sumScores(front));
    rows += `<tr class="nine-gap"><td colspan="${columnCount}"></td></tr><tr class="nine-head">${headCells}</tr>`;
    rows += back.map(holeRow).join('') + subtotalRow('IN', sumScores(back));
  } else {
    rows += perHole.map(holeRow).join('');
  }
  const totals = sumScores(perHole);

  // Club order, with each club's full swings first and then its chip, pitch and bunker variants, e.g. 9i, 9i (chip).
  // Each club row expands like a hole row on the Score tab, showing its shots in hole order.
  let clubRows = '';
  Object.entries(clubStats)
    .sort(([, a], [, b]) => (CLUBS.indexOf(a.club) - CLUBS.indexOf(b.club)) || (a.rank - b.rank))
    .forEach(([key, st]) => {
      const open = cardOpenClubs.has(key);
      clubRows += `
        <tr class="expandable${open ? ' open' : ''}" data-action="toggle-club-row" data-club="${esc(key)}" tabindex="0" aria-expanded="${open}" aria-label="${esc(key)}, ${open ? 'hide' : 'show'} shots">
          <td class="club-cell">${esc(st.club)}${st.variant ? ` <span class="club-variant">${st.variant}</span>` : ''}</td><td>${st.n}</td><td>${st.measured ? `${Math.round(st.sum / st.measured)} m` : '–'}</td><td>${st.measured ? `${Math.round(st.max)} m` : '–'}</td>
        </tr>`;
      if (open) {
        clubRows += st.shots.map((shot, i) => `
        <tr class="shot-row${i === st.shots.length - 1 ? ' last' : ''}">
          <td></td>
          <td colspan="3"><div class="shot flush"><span>Hole ${shot.h}, shot ${shot.n}</span>${shot.rough ? '<span class="chiptag">rough</span>' : ''}<span class="shot-dist">${shot.d ? fmtDist(shot.d) : '–'}</span></div></td>
        </tr>`).join('');
      }
    });

  let hcpLine = '';
  if (hasInfo) {
    const hcp = round.handicap;
    const label = hcp
      ? `Playing handicap ${hcp.base}` + (hcp.allowance !== 100 ? ` at ${hcp.allowance}% = ${adjustedHandicap(round)}` : '')
      : 'Add playing handicap';
    hcpLine = isFinished(round)
      ? (hcp ? `<p class="hcp-line">${label}</p>` : '')
      : `<p class="hcp-line"><button class="inline-btn" data-action="edit-handicap">${label}</button></p>`;
  }
