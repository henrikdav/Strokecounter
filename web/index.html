  // Finishing (or unlocking) the round lives here, below the scorecard, with the same slider as unlocking a hole.
  const finishPart = isFinished(round)
    ? `<div class="round-end">
         <p class="hint"><strong>Round finished.</strong> It is read-only. Slide to unlock it if you need to change anything.</p>
         ${slider('unlock-round', 'Unlock round', 'Slide all the way to unlock the round')}
       </div>`
    : `<div class="round-end">
         <p class="hint">Done playing? Finishing the round makes it read-only and ends it on the watch. You can unlock it again here.</p>
         ${slider('finish-round', 'Finish round', 'Slide all the way to finish the round')}
       </div>`;
  const noIndexNote = round.handicap && hasInfo && !hasExtras
    ? '<p class="note">Extra strokes need a hole index on every hole played. Add it under My courses; it applies to new rounds.</p>'
    : '';

  const tabBar = `
      <div class="pills" role="group" aria-label="Scorecard view">
        <button class="pill${cardTab === 'score' ? ' on' : ''}" data-action="card-tab" data-tab="score" aria-pressed="${cardTab === 'score'}">Score</button>
        <button class="pill${cardTab === 'clubs' ? ' on' : ''}" data-action="card-tab" data-tab="clubs" aria-pressed="${cardTab === 'clubs'}">Clubs</button>
      </div>`;

  // Shot stats: the round's longest shot as a headline, then shots, average and longest per club.
  // The club list shows even when no distances were measured, e.g. when GPS was unavailable.
  const clubsTab = clubRows ? `
        ${longestAll
          ? `<p class="longest-line">Longest shot: <strong>${fmtDist(longestAll.d)}</strong> <span>${esc(longestAll.key)}, hole ${longestAll.h}</span></p>`
          : '<p class="note" style="margin:0 0 10px">No shot distances for this round yet. A distance is measured when a stroke and the next one, or its landing spot, both have a GPS position.</p>'}
        <table class="score clubs">
          <thead><tr><th>Club</th><th>Shots</th><th>Avg</th><th>Longest</th></tr></thead>
          <tbody>${clubRows}</tbody>
        </table>
        <p class="note">Putter and penalty strokes are not included. Avg and Longest use shots with a measured distance. Chip, pitch and bunker shots are listed separately from full swings with the same club; rough is marked on each shot. ≈ means GPS accuracy was worse than about 25 m.</p>`
    : `<p class="note">No shots with a club yet. Putter and penalty strokes are not counted here.</p>`;

  return `
    <div class="screen">
      <header class="top">
        <button class="ghost side" data-action="card-back">‹ Back</button>
        <h2>Scorecard</h2>
        <button class="ghost side right" data-action="export-round">Export</button>
      </header>
      <p class="card-title card-head">${esc(roundLabel(round))}<small>${round.tee ? `${esc(round.tee)} tee · ` : ''}${esc(dateFmt.format(round.createdAt))} ${esc(timeFmt.format(round.createdAt))}</small></p>
      ${round.note
        ? `<button class="round-note" data-action="round-note" aria-label="${isFinished(round) ? 'Read' : 'Edit'} round note"><span>${esc(round.note)}</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>`
        : (isFinished(round) ? '' : '<button class="inline-btn add-note" data-action="round-note">Add a note</button>')}
      ${tabBar}
      <main class="scroll">
        ${cardTab === 'clubs' ? clubsTab : `
        ${hcpLine}
        ${penaltyCount ? `<p class="note" style="margin:0 0 10px">Penalty strokes: ${penaltyCount}</p>` : ''}
        <table class="score">
          <thead><tr>${headCells}</tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr>
            <td class="grp">Total</td>
            ${hasInfo ? `<td class="grp">${totals.par}</td><td class="grp grp-end">–</td>` : ''}
            ${hasExtras ? `<td>${totals.extra || '–'}</td>` : ''}
            <td class="strokes-cell">${totals.strokes === null ? '–' : totals.strokes}</td>
            ${hasInfo ? resultCells(totals) : ''}
          </tr></tfoot>
        </table>
        ${noIndexNote}
        ${hasInfo ? `<p class="note">Par and index were copied from the course when the round started. Gross is strokes minus par on holes you have played, and Net is the same after your extra strokes. E means even par. ${hasExtras ? 'Extra is the handicap strokes you get on each hole. Points are Stableford: 2 for net par, 3 for net birdie, 1 for net bogey, 0 for net double bogey or worse.' : 'Net and Points need a playing handicap and a hole index on every hole.'}</p>` : ''}`}
        ${finishPart}
      </main>
    </div>`;
}

function renderSheet() {
  if (sheet.type === 'new') {
    const courses = [...db.courses].sort((a, b) => a.name.localeCompare(b.name));
    const courseField = courses.length ? `
        <label class="field"><span>Course</span>
          <select id="round-course">
            <option value="">No course</option>
            ${courses.map(c => `<option value="${esc(c.id)}">${esc(c.name)} (${c.holes.length} holes)</option>`).join('')}
          </select>
        </label>` : '';
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="New round">
        <h2>New round</h2>
        ${courseField}
        <label class="field" id="round-name-field"><span>Name</span>
          <input id="round-name" type="text" placeholder="Optional" autocomplete="off" maxlength="60">
        </label>
        <div class="seg" role="radiogroup" aria-label="Number of holes">
          <label><input type="radio" name="holes" value="18" checked><span>18 holes</span></label>
          <label><input type="radio" name="holes" value="9"><span>9 holes</span></label>
        </div>
        <div class="seg" id="nine-seg" role="radiogroup" aria-label="Which nine" hidden>
          <label><input type="radio" name="nine" value="front" checked><span>Front 9 (1–9)</span></label>
          <label><input type="radio" name="nine" value="back"><span>Back 9 (10–18)</span></label>
        </div>
        <label class="field tee-field" id="tee-field" hidden><span>Tee</span>
          <select id="round-tee"></select>
        </label>
        <div class="row2" id="hcp-row" hidden>
          <label class="field"><span>Playing handicap</span>
            <input id="round-hcp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Optional" autocomplete="off">
          </label>
          <label class="field"><span>Adjustment</span>
            <select id="round-allowance">${allowanceOptions(db.allowance)}</select>
          </label>
        </div>
        <p class="hint" id="hcp-hint" hidden style="margin-top:8px">${HCP_HINT}</p>
        <button class="primary" data-action="create-round">Start round</button>
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'import') {
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Import courses">
        <h2>Import from JSON</h2>
        <p class="hint">Paste one course or a list of courses. Each course has a name and 9 or 18 holes with par and length in meters, for example <code>{"name":"My Course","holes":[{"par":4,"length":352,"index":7}, …]}</code>. Index (1–18) is optional.</p>
        <p class="hint">For several tees, give the holes par and index, and list the tees with their lengths. A tee can also set its own par or index on a hole: <code>{"name":"My Course","holes":[{"par":4,"index":7}, …],"tees":[{"name":"Gul","holes":[{"length":352}, …]},{"name":"Röd","holes":[{"length":301,"par":5}, …]}]}</code></p>
        <textarea class="json-box" id="import-text" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <button class="primary" data-action="do-import">Import</button>
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'settings') {
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">
        <h2>Settings</h2>
        <div class="settings-list">
          <button class="settings-item" data-action="courses">My courses</button>
          <button class="settings-item" data-action="edit-bag">My bag</button>
          <button class="settings-item" data-action="export">Copy all data as JSON</button>
          <button class="settings-item" data-action="restore">Restore from backup</button>
        </div>
        <button class="link" data-action="close-sheet">Close</button>
      </div>`;
  }

  if (sheet.type === 'mark-reminder') {
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Mark the hole">
        <h2>Mark the hole first?</h2>
        <p class="hint">Standing at the hole, mark it to measure each stroke's distance to the pin. This is optional.</p>
        <button class="primary" data-action="mark-and-done">Mark now</button>
        <button class="link" data-action="skip-mark">Skip</button>
      </div>`;
  }

  if (sheet.type === 'restore' && sheet.backup) {
    const b = sheet.backup;
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Restore from backup">
        <h2>Replace all data?</h2>
        <p class="hint">Your ${countText(db.rounds.length, 'round')} and ${countText(db.courses.length, 'course')} will be deleted and replaced by the backup's ${countText(b.rounds.length, 'round')} and ${countText(b.courses.length, 'course')}. This cannot be undone.</p>
        <button class="danger" data-action="confirm-restore">Replace all data</button>
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'restore') {
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Restore from backup">
        <h2>Restore from backup</h2>
        <p class="hint">Paste the text from "Copy all data as JSON". This replaces all current data, rounds and courses, and cannot be undone.</p>
        <textarea class="json-box" id="restore-text" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <p class="form-error" id="restore-error" role="alert" hidden></p>
        <button class="primary" data-action="check-restore">Restore</button>
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'note') {
    const round = getRound();
    const isHole = sheet.scope === 'hole';
    const text = isHole ? holeNote(round, sheet.hole) : (round.note || '');
    const title = isHole ? `Note for hole ${sheet.hole}` : 'Round note';
    // A locked hole's note can be read but not changed, like its strokes; so can every note of a finished round.
    if (isFinished(round) || (isHole && isLocked(round, sheet.hole))) {
      return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
        <h2>${title}</h2>
        <p class="note-read">${esc(text)}</p>
        <p class="hint">${isFinished(round) ? 'The round is finished. Unlock it to change the note.' : `Hole ${sheet.hole} is locked. Unlock it to change the note.`}</p>
        <button class="link" data-action="close-sheet">Close</button>
      </div>`;
    }
    // No slide-in here: the text field is focused in the same tap, and iOS only places the keyboard correctly
    // when the sheet is already still in its final position.
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet no-rise" role="dialog" aria-modal="true" aria-label="${title}">
        <h2>${title}</h2>
        <p class="hint">${isHole ? 'What happened on this hole? Optional.' : 'How did the round go? Weather, company, anything worth remembering. Optional.'}</p>
        <textarea class="json-box note-box" id="note-text" maxlength="${NOTE_MAX[sheet.scope]}" spellcheck="true">${esc(text)}</textarea>
        <button class="primary" data-action="save-note">Save</button>
        ${text ? '<button class="danger" data-action="delete-note" style="margin-top:10px">Delete note</button>' : ''}
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'export') {
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Export round">
        <h2>Export round</h2>
        ${sheet.text
          ? `<p class="hint">A text summary of the whole round, ready to paste into a note, a message or an AI chat.</p>
             <textarea class="json-box export-box" id="export-text" readonly spellcheck="false">${esc(sheet.text)}</textarea>
             <button class="primary" data-action="copy-export">Copy</button>`
          : '<p class="hint">No strokes have been logged for this round yet, so there is nothing to export.</p>'}
        <button class="link" data-action="close-sheet">Close</button>
      </div>`;
  }

  if (sheet.type === 'handicap') {
    const current = (getRound() || {}).handicap || null;
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="Playing handicap">
        <h2>Playing handicap</h2>
        <div class="row2">
          <label class="field"><span>Playing handicap</span>
            <input id="hcp-edit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"
                   value="${current ? current.base : ''}">
          </label>
          <label class="field"><span>Adjustment</span>
            <select id="allowance-edit">${allowanceOptions(current ? current.allowance : db.allowance)}</select>
          </label>
        </div>
        <p class="hint" style="margin-top:8px">${HCP_HINT}</p>
        <button class="primary" data-action="save-handicap">Save</button>
        ${current ? '<button class="danger" data-action="remove-handicap" style="margin-top:10px">Remove handicap</button>' : ''}
        <button class="link" data-action="close-sheet">Cancel</button>
      </div>`;
  }

  if (sheet.type === 'bag') {
    const chips = CLUBS.map(c => {
      const on = db.activeClubs.includes(c);
      return `<button class="chip${on ? ' on' : ''}" data-action="toggle-club" data-club="${c}" aria-pressed="${on}">${c}</button>`;
    }).join('');
    return `
      <div class="backdrop" data-action="close-sheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="My bag">
        <h2>My bag</h2>
        <p class="hint">Choose the clubs you carry. Only these show up when you add a stroke.</p>
        <div class="chips">${chips}</div>
        <p class="hint" id="bag-count">${bagCountText()}</p>
        <button class="primary" data-action="close-sheet">Done</button>
      </div>`;
  }

  const round = getRound();
  const found = round ? findStroke(holeList(round, round.currentHole), sheet.strokeId) : null;
  if (!found) return '';
  const { stroke, index } = found;
  // Show the bag clubs, plus this stroke's club if it has since been removed from the bag, plus Penalty.
  const options = CLUBS.filter(c => db.activeClubs.includes(c) || c === stroke.club || (sheet.draft && c === sheet.draft.club)).concat(PENALTY);
  // A locked hole's strokes can only be read, including the comment.
  if (isLocked(round, round.currentHole)) {
    const mods = MODS.filter(m => stroke[m.key]).map(m => m.key);
    return `
    <div class="backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Stroke">
      <h2>Stroke ${index + 1} on hole ${round.currentHole}</h2>
      <p class="hint">${esc(stroke.club)}${mods.length ? ` (${mods.join(', ')})` : ''}</p>
      ${stroke.note ? `<p class="note-read">${esc(stroke.note)}</p>` : ''}
      <p class="hint">Hole ${round.currentHole} is locked. Unlock it to change this stroke.</p>
      <button class="link" data-action="close-sheet">Close</button>
    </div>`;
  }
  const draft = sheet.draft;
  // Penalty strokes take no modifiers; the buttons stay in place but are disabled, as on the round screen.
  const modToggles = `<p class="hint">Shot type and lie</p><div class="sheet-mods">${modsHtml(k => !!draft.mods[k], 'toggle-stroke-mod', draft.club === PENALTY)}</div>`;
  return `
    <div class="backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Edit stroke">
      <h2>Stroke ${index + 1} on hole ${round.currentHole}</h2>
      <p class="hint">Choose club</p>
      <div class="chips">${chipsHtml(options, draft.club, 'set-club')}</div>
      ${modToggles}
      <label class="field stroke-note-field"><span>Comment (optional)</span>
        <textarea class="json-box note-box stroke-note-box" id="stroke-note" maxlength="${NOTE_MAX.stroke}" rows="2"
                  placeholder="e.g. misread the wind">${esc(draft.note)}</textarea>
      </label>
      <button class="primary" data-action="save-stroke">Save</button>
      <button class="danger" data-action="delete-stroke" style="margin-top:10px">Delete stroke</button>
      <button class="link" data-action="close-sheet">Cancel</button>
    </div>`;
}

function bagCountText() {
  return `${db.activeClubs.length} of ${CLUBS.length} clubs in the bag`;
}

function render() {
  let html;
  if (view === 'round' && getRound()) html = renderRound();
  else if (view === 'card' && getRound()) html = renderCard();
  else if (view === 'courses') html = renderCourses();
  else if (view === 'course-edit' && draft) html = renderCourseEdit();
  else { view = 'list'; html = renderList(); }
  app.innerHTML = html + (sheet ? renderSheet() : '');
  if (view === 'round') {
    updateGps();
    updateLiveDistance();
    const strokes = app.querySelector('.strokes');
    if (strokes) strokes.scrollTop = strokes.scrollHeight;
  }
}

function popCounter() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = app.querySelector('.big');
  if (el && el.animate) el.animate([{ transform: 'scale(1.14)' }, { transform: 'scale(1)' }], { duration: 180, easing: 'ease-out' });
}

/* ---------- New round form ---------- */

// Reads the course and hole selection from the "New round" sheet.
function readNewRoundSelection() {
  const select = document.getElementById('round-course');
  const course = select ? db.courses.find(c => c.id === select.value) || null : null;
  const holesInput = document.querySelector('input[name="holes"]:checked');
  const nineInput = document.querySelector('input[name="nine"]:checked');
  let holeCount = holesInput ? Number(holesInput.value) || 18 : 18;
  if (course && course.holes.length === 9) holeCount = 9;
  const backNine = !!course && course.holes.length === 18 && holeCount === 9 && !!nineInput && nineInput.value === 'back';
  // With a single tee there is nothing to choose; otherwise use the tee picked in the list.
  const teeSelect = document.getElementById('round-tee');
  const tee = course ? (course.tees.find(t => teeSelect && t.id === teeSelect.value) || course.tees[0]) : null;
  return { course, tee, holeCount, startHole: backNine ? 10 : 1 };
}

// Keeps the "New round" sheet consistent with the selected course:
// - the free-text name is only used when no course is selected
// - a 9-hole course can only be played as 9 holes
// - front/back nine is only asked for when playing 9 holes on an 18-hole course
// - the handicap fields need a course, and warn when the holes to play have no index
function syncNewRoundForm() {
  const select = document.getElementById('round-course');
  const selected = select ? db.courses.find(c => c.id === select.value) || null : null;
  const nameField = document.getElementById('round-name-field');
  const radio18 = document.querySelector('input[name="holes"][value="18"]');
  const radio9 = document.querySelector('input[name="holes"][value="9"]');
  const nineSeg = document.getElementById('nine-seg');
  if (!nameField || !radio18 || !radio9 || !nineSeg) return;

  nameField.hidden = !!selected;
  if (selected && selected.holes.length === 9) {
    radio9.checked = true;
    radio18.disabled = true;
  } else {
    radio18.disabled = false;
  }
  nineSeg.hidden = !(selected && selected.holes.length === 18 && radio9.checked);

  // Tee choice, only when the course has more than one tee.
  const teeField = document.getElementById('tee-field');
  const teeSelect = document.getElementById('round-tee');
  if (teeField && teeSelect) {
    const tees = selected ? selected.tees : [];
    const keep = teeSelect.value;
    if (teeSelect.dataset.course !== (selected ? selected.id : '')) {
      teeSelect.innerHTML = tees.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
      teeSelect.dataset.course = selected ? selected.id : '';
      if (tees.some(t => t.id === keep)) teeSelect.value = keep;
    }
    teeField.hidden = tees.length < 2;
  }

  const hcpRow = document.getElementById('hcp-row');
  const hcpHint = document.getElementById('hcp-hint');
  if (hcpRow && hcpHint) {
    const { course, tee, holeCount, startHole } = readNewRoundSelection();
    hcpRow.hidden = !course;
    hcpHint.hidden = !course;
    if (course) {
      const played = teeHoles(course, tee).slice(startHole - 1, startHole - 1 + holeCount);
      hcpHint.textContent = played.every(h => Number.isInteger(h.index)) ? HCP_HINT : NO_INDEX_HINT;
    }
  }
}

function createRound() {
  const { course, tee, holeCount, startHole } = readNewRoundSelection();
  const nameInput = document.getElementById('round-name');

  // Copy par, length and index as played from the chosen tee, so later edits to the course don't change this round.
  const holeData = {};
  if (course) {
    const resolved = teeHoles(course, tee);
    for (let i = 0; i < holeCount; i++) {
      const hole = resolved[startHole - 1 + i];
      if (hole) holeData[startHole + i] = { par: hole.par, length: hole.length, index: Number.isInteger(hole.index) ? hole.index : null };
    }
  }

  let handicap = null;
  const hcpInput = document.getElementById('round-hcp');
  const allowanceSelect = document.getElementById('round-allowance');
  const allowance = allowanceSelect ? Number(allowanceSelect.value) || 100 : 100;
  const hcpDigits = hcpInput ? hcpInput.value.replace(/\D/g, '') : '';
  if (course && hcpDigits !== '') handicap = { base: parseInt(hcpDigits, 10), allowance };
  if (allowanceSelect) db.allowance = allowance;

  const round = {
    id: newId(),
    name: course ? course.name : (nameInput ? nameInput.value.trim() : ''),
    createdAt: Date.now(),
    courseId: course ? course.id : null,
    holeCount,
    startHole,
    sourceHoleCount: course ? course.holes.length : holeCount,
    currentHole: startHole,
    holeData,
    handicap,
    holes: {}
  };
  if (tee) round.tee = tee.name;
  db.rounds.push(round);
  openRound(round.id);
}

/* ---------- Course editor and import ---------- */

function emptyHoles() {
  return Array.from({ length: 18 }, () => ({ par: 4, index: null }));
}
function emptyTee(name) {
  return { id: newId(), name, holes: Array.from({ length: 18 }, () => ({ length: null, par: null, index: null })), overrides: false };
}

function startNewCourse() {
  draft = { id: null, name: '', count: 18, all: emptyHoles(), tees: [emptyTee('Standard')], teeIdx: 0 };
  view = 'course-edit';
  render();
}

function startEditCourse(id) {
  const course = db.courses.find(c => c.id === id);
  if (!course) return;
  const all = emptyHoles();
  course.holes.forEach((h, i) => { all[i] = { par: h.par, index: Number.isInteger(h.index) ? h.index : null }; });
  const tees = course.tees.map(t => {
    const tee = emptyTee(t.name);
    tee.id = t.id;
    t.holes.forEach((h, i) => {
      tee.holes[i] = {
        length: Number.isFinite(h.length) ? h.length : null,
        par: Number.isInteger(h.par) ? h.par : null,
        index: Number.isInteger(h.index) ? h.index : null
      };
    });
    tee.overrides = tee.holes.some(h => h.par !== null || h.index !== null);
    return tee;
  });
  draft = { id: course.id, name: course.name, count: course.holes.length, all, tees, teeIdx: 0 };
  view = 'course-edit';
  render();
}

// Keeps typed names in the draft before the editor is re-rendered.
function keepDraftNames() {
  const nameInput = document.getElementById('course-name');
  if (nameInput) draft.name = nameInput.value;
  const teeInput = document.getElementById('tee-name');
  if (teeInput) draft.tees[draft.teeIdx].name = teeInput.value.trim();
}

function saveCourse() {
  const nameInput = document.getElementById('course-name');
  const name = nameInput ? nameInput.value.trim() : '';
  if (!name) {
    toast('Give the course a name');
    if (nameInput) nameInput.focus();
    return;
  }
  keepDraftNames();
  const n = draft.count;
  const names = draft.tees.map(t => t.name.trim());
  const badName = names.findIndex(v => !v);
  if (badName >= 0) {
    draft.teeIdx = badName; render();
    toast('Give every tee a name');
    return;
  }
  if (new Set(names.map(v => v.toLowerCase())).size !== names.length) {
    toast('Each tee needs its own name');
    return;
  }
  // Check the indexes as each tee will actually be played, including its own overrides.
  for (let ti = 0; ti < draft.tees.length; ti++) {
    const tee = draft.tees[ti];
    const pars = tee.holes.slice(0, n).map(h => h.par).filter(v => v !== null);
    if (pars.some(v => !PARS.includes(v))) {
      draft.teeIdx = ti; render();
      toast(`Par must be ${PARS[0]}–${PARS[PARS.length - 1]} (${tee.name})`);
      return;
    }
    const indices = draft.all.slice(0, n).map((h, i) => tee.holes[i].index !== null ? tee.holes[i].index : h.index).filter(v => v !== null);
    if (indices.some(v => !Number.isInteger(v) || v < 1 || v > 18)) {
      draft.teeIdx = ti; render();
      toast('Hole index must be between 1 and 18');
      return;
    }
    if (new Set(indices).size !== indices.length) {
      draft.teeIdx = ti; render();
      toast(draft.tees.length > 1 ? `Each hole index can only be used once (${tee.name})` : 'Each hole index can only be used once');
      return;
    }
  }
  const holes = draft.all.slice(0, n).map(h => ({ par: h.par, index: h.index === undefined ? null : h.index }));
  const tees = draft.tees.map((t, ti) => ({
    id: t.id,
    name: names[ti],
    holes: t.holes.slice(0, n).map(h => {
      const out = { length: h.length };
      if (h.par !== null) out.par = h.par;
      if (h.index !== null) out.index = h.index;
      return out;
    })
  }));
  const existing = draft.id ? db.courses.find(c => c.id === draft.id) : null;
  if (existing) {
    existing.name = name;
    existing.holes = holes;
    existing.tees = tees;
  } else {
    db.courses.push({ id: newId(), name, holes, tees });
  }
  saveDb();
  draft = null;
  view = 'courses';
  render();
}

function deleteCourse() {
  if (!draft || !draft.id) return;
  if (!confirm('Delete this course? Rounds you have already played keep their par and length.')) return;
  db.courses = db.courses.filter(c => c.id !== draft.id);
  saveDb();
  draft = null;
  view = 'courses';
  render();
}

function updateDraftTotals() {
  const el = document.getElementById('course-totals');
  if (el && draft) el.textContent = draftTotalsText();
}

// Validates one imported course. Accepts a single flat list of holes with par, length and index (one tee,
// "Standard"), or course holes with par and index plus a list of tees with lengths and optional par/index.
// Returns a course or null.
function parseCourse(item) {
  if (!item || typeof item.name !== 'string' || !item.name.trim() || !Array.isArray(item.holes)) return null;
  const n = item.holes.length;
  if (n !== 9 && n !== 18) return null;
  const num = (v, ok) => {
    if (v === undefined || v === null || v === '') return null;
    const x = Number(v);
    return ok(x) ? x : undefined;   // undefined marks an invalid value
  };
  const isPar = x => Number.isInteger(x) && PARS.includes(x);
  const isIndex = x => Number.isInteger(x) && x >= 1 && x <= 18;
  const isLength = x => Number.isFinite(x) && x >= 0 && x <= 1000;

  const holes = [];
  for (const h of item.holes) {
    const par = num(h && h.par, isPar);
    const index = num(h && h.index, isIndex);
    if (par === null || par === undefined || index === undefined) return null;
    holes.push({ par, index });
  }

  let teeList = item.tees;
  if (teeList === undefined) teeList = [{ name: 'Standard', holes: item.holes.map(h => ({ length: h && h.length })) }];
  if (!Array.isArray(teeList) || !teeList.length) return null;
  const tees = [];
  for (const t of teeList) {
    if (!t || typeof t.name !== 'string' || !t.name.trim() || !Array.isArray(t.holes) || t.holes.length !== n) return null;
    const teeHolesList = [];
    for (const h of t.holes) {
      const length = num(h && h.length, isLength);
      const par = num(h && h.par, isPar);
      const index = num(h && h.index, isIndex);
      if (length === undefined || par === undefined || index === undefined) return null;
      const out = { length: length === null ? null : Math.round(length) };
      if (par !== null) out.par = par;
      if (index !== null) out.index = index;
      teeHolesList.push(out);
    }
    tees.push({ id: newId(), name: t.name.trim().slice(0, 24), holes: teeHolesList });
  }
  const course = { id: newId(), name: item.name.trim().slice(0, 60), holes, tees };
  // Each tee, as played, needs unique indexes.
  for (const tee of tees) {
    const used = teeHoles(course, tee).map(h => h.index).filter(v => v !== null);
    if (new Set(used).size !== used.length) return null;
  }
  return course;
}

function importCourses(text) {
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    toast('That is not valid JSON');
    return;
  }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.courses) ? data.courses : [data]);
  const parsed = [];
  for (const item of list) {
    const course = parseCourse(item);
    if (!course) {
      toast('Could not read the course data. Check the format.');
      return;
    }
    parsed.push(course);
  }
  if (!parsed.length) {
    toast('No courses found');
    return;
  }
  db.courses.push(...parsed);
  saveDb();
  sheet = null;
  render();
  toast(parsed.length === 1 ? 'Imported 1 course' : `Imported ${parsed.length} courses`);
}

/* ---------- Restore from backup ---------- */

// Reads a pasted backup. Problems are shown in the sheet so the pasted text stays in place;
// a valid backup moves the sheet on to the confirmation step.
function checkRestore(text) {
  const error = document.getElementById('restore-error');
  const fail = message => { error.textContent = message; error.hidden = false; };
  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    fail('That is not valid JSON. Paste the whole backup, from the first { to the last }.');
    return;
  }
  if (!data || typeof data !== 'object' || Array.isArray(data) || !Array.isArray(data.rounds) || !Array.isArray(data.courses)) {
    fail('This does not look like a backup. It needs both "rounds" and "courses" lists.');
    return;
  }
  if (!data.rounds.every(r => r && typeof r === 'object' && r.id && r.holes && typeof r.holes === 'object')) {
    fail('Some rounds in the backup could not be read. Nothing was changed.');
    return;
  }
  if (!data.courses.every(isCourseShape)) {
    fail('Some courses in the backup could not be read. Nothing was changed.');
    return;
  }
  sheet = { type: 'restore', backup: data };
  render();
}

// Replaces everything with the backup. Settings the backup does not include (adjustment, next club
// and modifiers) are kept from the current data.
function confirmRestore() {
  const backup = sheet.backup;
  db = normalizeDb({
    allowance: db.allowance, club: db.club, modFlags: db.modFlags, activeClubs: db.activeClubs,
    ...backup,
    activeRoundId: null
  });
  db.courses.forEach(migrateCourse);
  migrateStrokeIds(db);
  saveDb();
  sheet = null;
  view = 'list';
  roundId = null;
  render();
  toast(`Restored ${countText(db.rounds.length, 'round')} and ${countText(db.courses.length, 'course')}`);
}

function countText(n, word) {
  return `${n} ${word}${n === 1 ? '' : 's'}`;
}

/* ---------- Apple Watch ---------- */

// In the iOS app, the round opened last is mirrored to the Apple Watch: its holes, the bag and the strokes so far.
// Strokes logged on the watch come back as events and are merged by stroke id (applyWatchEvents).
// In a normal browser there is no bridge and none of this runs.
const watchBridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.watch;
let watchTimer = null;

function scheduleWatchSnapshot() {
  if (!watchBridge) return;
  clearTimeout(watchTimer);
  watchTimer = setTimeout(sendWatchSnapshot, 300);
}

function sendWatchSnapshot() {
  const round = db.rounds.find(r => r.id === db.watchRoundId) || null;
  const snapshot = { round: null, bag: db.activeClubs, club: db.club };
  if (round) {
    const course = round.courseId ? db.courses.find(c => c.id === round.courseId) : null;
    const strokes = {};
    holeNumbers(round).forEach(h => {
      strokes[h] = (round.holes[h] || []).map(s => ({
        id: s.id, club: s.club, mods: MODS.filter(m => s[m.key]).map(m => m.key), t: s.t,
        ...(hasPos(s) ? { lat: s.lat, lng: s.lng, acc: s.acc || 0 } : {})
      }));
    });
    snapshot.round = {
      id: round.id,
      name: course ? course.name : roundLabel(round),
      holes: holeNumbers(round).map(h => {
        const info = holeInfo(round, h);
        return { number: h, par: info ? info.par : null, index: info && Number.isInteger(info.index) ? info.index : null };
      }),
      currentHole: round.currentHole,
      // A finished round is sent with every hole locked, so the watch treats it as read-only throughout.
      locked: isFinished(round) ? holeNumbers(round) : (round.locked || []),
      finished: isFinished(round),
      strokes,
      removed: round.removedStrokeIds || []
    };
  }
  watchBridge.postMessage({ type: 'snapshot', json: JSON.stringify(snapshot) });
}

function rememberRemoved(round, id) {
  if (!round.removedStrokeIds) round.removedStrokeIds = [];
  if (!round.removedStrokeIds.includes(id)) round.removedStrokeIds.push(id);
}

// Called by the iOS app with events from the watch:
//   { type: 'add', roundId, hole, stroke: { id, club, mods: ['chip', ...], t, lat?, lng?, acc? } }
//   { type: 'remove', roundId, hole, id, t }
//   { type: 'finish', roundId, hole, t }
//   { type: 'position', roundId, hole, id, position: { lat, lng, acc } }   (a fix that arrived just after logging)
// Applying an event twice changes nothing, so the app can deliver again after a resend or a crash.
// A stroke removed on either device stays removed, even if its 'add' arrives late.
// The hole lock is enforced here, not only in the screens: a stroke added on the watch to a hole that was already
// locked is refused and remembered as removed (so the watch drops it too), and a removal is ignored.
function applyWatchEvents(events) {
  let changed = false;
  events.forEach(e => {
    const round = db.rounds.find(r => r.id === e.roundId);
    if (!round || !Number.isInteger(e.hole)) return;
    const list = holeList(round, e.hole);
    if (e.type === 'add' && e.stroke && e.stroke.id) {
      if (findStroke(list, e.stroke.id) || (round.removedStrokeIds || []).includes(e.stroke.id)) return;
      if (refusedByLock(round, e.hole, e.stroke.t)) { rememberRemoved(round, e.stroke.id); changed = true; return; }
      const stroke = { id: e.stroke.id, t: e.stroke.t, club: e.stroke.club };
      if (hasPos(e.stroke)) { stroke.lat = e.stroke.lat; stroke.lng = e.stroke.lng; stroke.acc = e.stroke.acc || 0; }
      if (stroke.club !== PENALTY) (e.stroke.mods || []).forEach(k => { if (MODS.some(m => m.key === k)) stroke[k] = true; });
      // Keep the strokes in the order they were played, whichever device logged them and whenever they arrive.
      const at = list.findIndex(s => s.t > stroke.t);
      list.splice(at < 0 ? list.length : at, 0, stroke);
      changed = true;
    } else if (e.type === 'remove' && e.id) {
      if (refusedByLock(round, e.hole, e.t)) return;
      const found = findStroke(list, e.id);
      if (found) { list.splice(found.index, 1); changed = true; }
      if (!(round.removedStrokeIds || []).includes(e.id)) { rememberRemoved(round, e.id); changed = true; }
    } else if (e.type === 'position' && e.id && hasPos(e.position)) {
      // Only fills in a missing position; a stroke that already has one keeps it.
      const found = findStroke(list, e.id);
      if (found && !hasPos(found.stroke)) {
        Object.assign(found.stroke, { lat: e.position.lat, lng: e.position.lng, acc: e.position.acc || 0 });
        changed = true;
      }
    } else if (e.type === 'finish') {
      if (isFinished(round) && !(Number.isFinite(e.t) && e.t < round.finishedAt)) return;
      if (!isHoleLocked(round, e.hole)) { setHoleLock(round, e.hole, Number.isFinite(e.t) ? e.t : Date.now()); changed = true; }
      const last = (round.startHole || 1) + round.holeCount - 1;
      if (round.currentHole === e.hole && e.hole < last) { round.currentHole = e.hole + 1; changed = true; }
    }
  });
  if (changed) {
    saveDb();
    // An open sheet is left alone (it may hold a comment being typed); closing it renders anyway.
    if (!sheet) render();
  } else {
    scheduleWatchSnapshot();   // nothing new, but tell the watch again what the phone has, so it can stop resending
  }
  return true;
}

/* ---------- Round actions ---------- */

function openRound(id) {
  roundId = id;
  view = 'round';
  sheet = null;
  cardBackTo = 'round';
  roundBackTo = 'list';
  // A finished round is only looked at: it does not become the round to continue, the watch keeps its round,
  // and GPS stays off.
  if (isFinished(getRound())) { render(); return; }
  db.activeRoundId = id;
  db.watchRoundId = id;
  saveDb();
  startGps();
  requestWake();
  render();
}

// A finished round in Past rounds opens on its scorecard; Back goes home. An unfinished one (only rounds from before
// rounds could be finished) opens on its holes as before.
function openPastRound(id) {
  const round = db.rounds.find(r => r.id === id);
  if (!round) return;
  if (!isFinished(round)) { openRound(id); return; }
  roundId = id;
  sheet = null;
  view = 'card'; cardTab = 'score'; cardScroll = { score: 0, clubs: 0 };
  cardOpen = new Set(); cardOpenClubs = new Set();
  cardBackTo = 'list';
  roundBackTo = 'list';
  render();
}

function closeRound() {
  view = 'list';
  roundId = null;
  sheet = null;
  db.activeRoundId = null;
  saveDb();
  stopGps();
  releaseWake();
  render();
}

function addStroke() {
  const round = getRound();
  const list = holeList(round, round.currentHole);
  const fix = freshFix();
  const stroke = { id: strokeId(), t: Date.now(), club: db.club };
  if (db.club !== PENALTY) db.modFlags.forEach(k => { stroke[k] = true; });
  if (fix) { stroke.lat = fix.lat; stroke.lng = fix.lng; stroke.acc = fix.acc; }
  list.push(stroke);
  db.modFlags = [];   // modifiers describe one stroke, so they reset after it is logged
  saveDb();
  render();
  popCounter();

  // No recent fix: ask for a single position and attach it to the stroke when it arrives.
  if (!fix && 'geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(pos => {
      stroke.lat = pos.coords.latitude;
      stroke.lng = pos.coords.longitude;
      stroke.acc = pos.coords.accuracy;
      saveDb();
      if (view === 'round' && !sheet) render();
    }, () => { /* the stroke is kept, just without a position */ }, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 10000
    });
  }
}

function measureLanding() {
  const round = getRound();
  const list = holeList(round, round.currentHole);
  const stroke = list[list.length - 1];
  if (!stroke || !hasPos(stroke)) return;
  const fix = freshFix();
  if (!fix) { toast('No GPS fix yet'); return; }
  stroke.landing = { lat: fix.lat, lng: fix.lng, acc: fix.acc };
  saveDb();
  render();
}

// Writes the edit-stroke draft (club, modifiers, comment) to the stroke. Only those fields change, so the stroke's
// position and any live distance measurement are untouched. Locked holes are left alone.
function saveStrokeDraft() {
  const round = getRound();
  if (!sheet || !sheet.draft || isLocked(round, round.currentHole)) return;
  const found = findStroke(holeList(round, round.currentHole), sheet.strokeId);
  const stroke = found && found.stroke;
  if (stroke) {
    const { club, mods, note } = sheet.draft;
    stroke.club = club;
    MODS.forEach(m => { if (mods[m.key] && club !== PENALTY) stroke[m.key] = true; else delete stroke[m.key]; });
    const text = note.trim().slice(0, NOTE_MAX.stroke);
    if (text) stroke.note = text; else delete stroke.note;
  }
  sheet = null;
  saveDb();
  render();
}

// Saves the open note sheet's text; an empty note is removed. Locked holes' notes are left alone.
function saveNote(value) {
  const round = getRound();
  const text = value.trim().slice(0, NOTE_MAX[sheet.scope]);
  if (sheet.scope === 'hole') {
    if (isLocked(round, sheet.hole)) return;
    round.notes = round.notes || {};
    if (text) round.notes[sheet.hole] = text; else delete round.notes[sheet.hole];
  } else if (text) {
    round.note = text;
  } else {
    delete round.note;
  }
  sheet = null;
  saveDb();
  render();
}

function focusNote() {
  const input = document.getElementById('note-text');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

// Done: lock the current hole and go on to the next one, or to the scorecard after the last hole.
// Saves the current GPS position as where the hole is today. Marking again overwrites it.
// Returns false when there is no recent fix.
function markHole() {
  const round = getRound();
  const fix = freshFix();
  if (!fix) { toast('No GPS fix yet'); return false; }
  if (!round.holePositions) round.holePositions = {};
  round.holePositions[round.currentHole] = { lat: fix.lat, lng: fix.lng, acc: fix.acc, t: Date.now() };
  saveDb();
  render();
  toast(`Hole marked (±${Math.round(fix.acc)} m)`, accuracyClass(fix.acc));
  return true;
}

// Done on a hole with strokes but no marked hole asks once whether to mark it first. Skip carries on as usual.
const markReminded = new Set();   // "roundId:hole" already asked about, for this session
function tapDone() {
  const round = getRound();
  const hole = round.currentHole;
  const key = round.id + ':' + hole;
  if (!holePosition(round, hole) && holeList(round, hole).length && !markReminded.has(key)) {
    markReminded.add(key);
    sheet = { type: 'mark-reminder' };
    render();
    return;
  }
  doneHole();
}

function doneHole() {
  const round = getRound();
  const hole = round.currentHole;
  const last = (round.startHole || 1) + round.holeCount - 1;
  setHoleLock(round, hole, Date.now());
  if (hole < last) {
    round.currentHole = hole + 1;
  } else {
    view = 'card'; cardTab = 'score'; cardScroll = { score: 0, clubs: 0 };
    cardOpen = new Set(); cardOpenClubs = new Set();
  }
  saveDb();
  render();
}

// Finishing makes the round read-only and stops it being the one to continue; the snapshot that saveDb() sends
// tells the watch, which ends its workout for the round. Only the phone can finish or unlock a round.
function finishRound() {
  const round = getRound();
  if (!round || isFinished(round)) return;
  round.finished = true;
  round.finishedAt = Date.now();
  if (db.activeRoundId === round.id) db.activeRoundId = null;
  sheet = null;
  stopGps();
  releaseWake();
  saveDb();
  render();
  toast('Round finished');
}

function unlockRound() {
  const round = getRound();
  if (!round || !isFinished(round)) return;
  round.finished = false;
  delete round.finishedAt;
  db.activeRoundId = round.id;
  db.watchRoundId = round.id;
  startGps();
  requestWake();
  saveDb();
  render();
  toast('Round unlocked');
}

function unlockHole() {
  const round = getRound();
  clearHoleLock(round, round.currentHole);
  saveDb();
  render();
}

function saveHandicap() {
  const round = getRound();
  const input = document.getElementById('hcp-edit');
  const select = document.getElementById('allowance-edit');
  const digits = input ? input.value.replace(/\D/g, '') : '';
  const allowance = select ? Number(select.value) || 100 : 100;
  round.handicap = digits === '' ? null : { base: parseInt(digits, 10), allowance };
  db.allowance = allowance;
  sheet = null;
  saveDb();
  render();
}

function changeHole(delta) {
  const round = getRound();
  const first = round.startHole || 1;
  const last = first + round.holeCount - 1;
  round.currentHole = Math.max(first, Math.min(last, round.currentHole + delta));
  saveDb();
  render();
}

// Adds or removes a club from the bag. Updates the open sheet in place (no full
// re-render, so the sheet doesn't flicker); the screen behind refreshes on close.
function toggleClub(club) {
  const isActive = db.activeClubs.includes(club);
  if (isActive && db.activeClubs.length === 1) {
    toast('Keep at least one club in the bag');
    return;
  }
  db.activeClubs = CLUBS.filter(c => (c === club ? !isActive : db.activeClubs.includes(c)));
  if (!db.activeClubs.includes(db.club)) db.club = db.activeClubs[0];
  saveDb();

  app.querySelectorAll('.sheet .chip').forEach(chip => {
    const on = db.activeClubs.includes(chip.dataset.club);
    chip.classList.toggle('on', on);
    chip.setAttribute('aria-pressed', String(on));
  });
  const count = document.getElementById('bag-count');
  if (count) count.textContent = bagCountText();
}

async function exportData() {
  copyText(JSON.stringify({
    exportedAt: new Date().toISOString(),
    courses: db.courses,
    rounds: db.rounds,
    activeClubs: db.activeClubs,
    holeMetrics: holeMetrics()
  }, null, 2));
}

// Distances worked out from the marked holes, for analysis. Computed at export only and never read back
// (Restore ignores this key). Per round and hole, one entry per stroke: toHole is the distance to the hole
// in meters, null when unknown.
function holeMetrics() {
  const round1 = v => v === null ? null : Math.round(v * 10) / 10;
  return db.rounds.map(round => {
    const holes = {};
    holeNumbers(round).forEach(h => {
      const pin = holePosition(round, h);
      const list = round.holes[h] || [];
      if (!pin || !list.length) return;
      holes[h] = list.map((stroke, i) => ({ toHole: round1(distanceToHole(list, i, pin)?.m ?? null) }));
    });
    return { roundId: round.id, holes };
  }).filter(r => Object.keys(r.holes).length);
}

// Copies text to the clipboard, falling back to a hidden text area where the Clipboard API is unavailable.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  } catch (err) {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (copyErr) { ok = false; }
    area.remove();
    toast(ok ? 'Copied to clipboard' : 'Could not copy');
  }
}

/* ---------- Event handling ---------- */

// Expands or collapses a scorecard row (a hole or a club), keeping the scroll position and keyboard focus.
function toggleCardRow(openSet, key, rowSelector) {
  if (openSet.has(key)) openSet.delete(key); else openSet.add(key);
  const scroller = app.querySelector('.scroll');
  const top = scroller ? scroller.scrollTop : 0;
  render();
  const next = app.querySelector('.scroll');
  if (next) next.scrollTop = top;
  const row = app.querySelector(rowSelector);
  if (row && document.activeElement === document.body) row.focus({ preventScroll: true });
}

// One delegated click handler for the whole app.
// Expandable scorecard rows are not buttons, so let Enter and Space toggle them from the keyboard.
app.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  if (!event.target.matches || !event.target.matches('tr.expandable[data-action]')) return;
  event.preventDefault();
  event.target.click();
});

app.addEventListener('click', event => {
  // A drag on a past round ends with a click; it only moves the row. With a row slid open, a tap anywhere but
  // its Delete button just closes it.
  if (performance.now() < swallowClickUntil) return;
  if (openRowId && !event.target.closest('.past-del')) { closeOpenRow(); return; }
  const el = event.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  const round = getRound();

  switch (action) {
    case 'new-round': sheet = { type: 'new' }; render(); break;
    case 'hard-reload': hardReload(); break;
    case 'create-round': createRound(); break;
    case 'open-round': openRound(el.dataset.id); break;
    case 'open-past': openPastRound(el.dataset.id); break;
    case 'delete-round':
      if (confirm('Delete this round? This cannot be undone.')) {
        db.rounds = db.rounds.filter(r => r.id !== el.dataset.id);
        openRowId = null;
        saveDb();
        render();
      }
      break;
    case 'export': exportData(); if (sheet && sheet.type === 'settings') { sheet = null; render(); } break;
    case 'settings': sheet = { type: 'settings' }; render(); break;
    case 'restore': sheet = { type: 'restore' }; render(); break;
    case 'check-restore': checkRestore(document.getElementById('restore-text').value); break;
    case 'confirm-restore': confirmRestore(); break;

    case 'courses': view = 'courses'; sheet = null; render(); break;
    case 'courses-back': view = 'list'; render(); break;
    case 'new-course': startNewCourse(); break;
    case 'edit-course': startEditCourse(el.dataset.id); break;
    case 'cancel-course': draft = null; view = 'courses'; render(); break;
    case 'save-course': saveCourse(); break;
    case 'delete-course': deleteCourse(); break;
    case 'set-par': {
      const par = Number(el.dataset.par);
      const i = Number(el.dataset.i);
      draft.all[i].par = par;
      el.parentElement.querySelectorAll('.par-btn').forEach(btn => {
        btn.classList.toggle('on', Number(btn.dataset.par) === par);
      });
      const over = document.querySelector(`.opar[data-i="${i}"]`);
      if (over) over.placeholder = String(par);   // the tee's par field shows the course par it falls back to
      updateDraftTotals();
      break;
    }
    case 'select-tee': keepDraftNames(); draft.teeIdx = Number(el.dataset.i); render(); break;
    case 'add-tee':
      keepDraftNames();
      draft.tees.push(emptyTee(`Tee ${draft.tees.length + 1}`));
      draft.teeIdx = draft.tees.length - 1;
      render();
      { const input = document.getElementById('tee-name'); if (input) { input.focus(); input.select(); } }
      break;
    case 'remove-tee': {
      keepDraftNames();
      const tee = draft.tees[draft.teeIdx];
      if (draft.tees.length < 2 || !confirm(`Remove the tee "${tee.name || 'unnamed'}" from this course? Rounds you have already played are not affected.`)) break;
      draft.tees.splice(draft.teeIdx, 1);
      draft.teeIdx = Math.max(0, draft.teeIdx - 1);
      render();
      break;
    }
    case 'toggle-tee-overrides': {
      keepDraftNames();
      const tee = draft.tees[draft.teeIdx];
      tee.overrides = !tee.overrides;
      // Turning them off means this tee uses the course's par and index everywhere again.
      if (!tee.overrides) tee.holes.forEach(h => { h.par = null; h.index = null; });
      render();
      break;
    }
    case 'import-course': sheet = { type: 'import' }; render(); break;
    case 'do-import': importCourses(document.getElementById('import-text').value); break;

    case 'edit-bag': sheet = { type: 'bag' }; render(); break;
    case 'toggle-mod-flag': {
      const key = el.dataset.mod;
      db.modFlags = db.modFlags.includes(key) ? db.modFlags.filter(k => k !== key) : db.modFlags.concat(key);
      saveDb();
      const on = db.modFlags.includes(key);
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', String(on));
      break;
    }
    case 'toggle-stroke-mod':
      if (sheet && sheet.draft) { sheet.draft.mods[el.dataset.mod] = !sheet.draft.mods[el.dataset.mod]; render(); }
      break;
    case 'save-stroke': saveStrokeDraft(); break;
    case 'toggle-club': toggleClub(el.dataset.club); break;
    case 'back':
      if (roundBackTo === 'card') { roundBackTo = 'list'; view = 'card'; render(); }
      else closeRound();
      break;
    case 'scorecard':
      // From a hole opened on a Past rounds scorecard this is just the way back to that scorecard.
      if (roundBackTo === 'card') { roundBackTo = 'list'; view = 'card'; render(); break; }
      view = 'card'; cardTab = 'score'; cardScroll = { score: 0, clubs: 0 };
      cardOpen = new Set(); cardOpenClubs = new Set();
      cardBackTo = 'round';
      render();
      break;
    case 'toggle-hole': toggleCardRow(cardOpen, Number(el.dataset.hole), `tr[data-action="toggle-hole"][data-hole="${el.dataset.hole}"]`); break;
    case 'toggle-club-row': toggleCardRow(cardOpenClubs, el.dataset.club, `tr[data-action="toggle-club-row"][data-club="${CSS.escape(el.dataset.club)}"]`); break;
    case 'card-tab': {
      const scroller = app.querySelector('.scroll');
      if (scroller) cardScroll[cardTab] = scroller.scrollTop;
      cardTab = el.dataset.tab === 'clubs' ? 'clubs' : 'score';
      render();
      const next = app.querySelector('.scroll');
      if (next) next.scrollTop = cardScroll[cardTab];
      break;
    }
    case 'card-back':
      if (cardBackTo === 'list') closeRound();
      else { view = 'round'; render(); }
      break;
    case 'edit-handicap': if (!isFinished(round)) { sheet = { type: 'handicap' }; render(); } break;
    case 'export-round': sheet = { type: 'export', text: roundExportText(round) }; render(); break;
    case 'copy-export': copyText(sheet.text); break;
    case 'hole-note': sheet = { type: 'note', scope: 'hole', hole: round.currentHole }; render(); focusNote(); break;
    case 'round-note': sheet = { type: 'note', scope: 'round' }; render(); if (!isFinished(round)) focusNote(); break;
    case 'save-note': {
      const input = document.getElementById('note-text');
      saveNote(input ? input.value : '');
      break;
    }
    case 'delete-note': saveNote(''); break;
    case 'save-handicap': if (!isFinished(round)) saveHandicap(); break;
    case 'remove-handicap':
      round.handicap = null;
      sheet = null;
      saveDb();
      render();
      break;
    case 'goto-hole':
      round.currentHole = Number(el.dataset.hole);
      view = 'round';
      if (cardBackTo === 'list') roundBackTo = 'card';
      saveDb();
      render();
      break;
    case 'prev-hole': changeHole(-1); break;
    case 'next-hole': changeHole(1); break;
    case 'add': addStroke(); break;
    case 'done-hole': tapDone(); break;
    case 'course-map': if (courseMapBridge) openCourseMap(); break;
    case 'mark-hole': if (!isLocked(round, round.currentHole)) markHole(); break;
    case 'mark-and-done': if (markHole()) { sheet = null; doneHole(); } break;
    case 'skip-mark': sheet = null; doneHole(); break;
    case 'measure': if (!isLocked(round, round.currentHole)) measureLanding(); break;
    case 'pick-club':
      db.club = el.dataset.club;
      saveDb();
      app.querySelectorAll('.dock .chip[data-club]').forEach(chip => {
        chip.classList.toggle('on', chip.dataset.club === db.club);
      });
      // Penalty strokes take no modifiers, so the buttons are disabled while Penalty is selected.
      app.querySelectorAll('.dock .modbtn').forEach(btn => { btn.disabled = db.club === PENALTY; });
      break;
    case 'edit-stroke': {
      if (isLocked(round, round.currentHole)) break;  // locked holes are read-only until unlocked
      const found = findStroke(holeList(round, round.currentHole), el.dataset.id);
      if (!found) break;
      const stroke = found.stroke;
      // Edits go into a draft; nothing is written to the stroke until Save.
      const mods = {};
      MODS.forEach(m => { mods[m.key] = !!stroke[m.key]; });
      sheet = { type: 'stroke', strokeId: stroke.id, draft: { club: stroke.club, mods, note: stroke.note || '' } };
      render();
      break;
    }
    case 'view-stroke': sheet = { type: 'stroke', strokeId: el.dataset.id }; render(); break;
    case 'set-club':
      if (sheet && sheet.draft) { sheet.draft.club = el.dataset.club; render(); }
      break;
    case 'delete-stroke': {
      const list = holeList(round, round.currentHole);
      const found = findStroke(list, sheet.strokeId);
      if (found) {
        list.splice(found.index, 1);
        rememberRemoved(round, found.stroke.id);
      }
      sheet = null;
      saveDb();
      render();
      break;
    }
    case 'close-sheet': sheet = null; render(); break;
  }
});

app.addEventListener('change', event => {
  const target = event.target;
  if (target.id === 'round-course') {
    // Pick the matching hole count for the chosen course.
    const course = db.courses.find(c => c.id === target.value);
    if (course) {
      const radio = document.querySelector(`input[name="holes"][value="${course.holes.length}"]`);
      if (radio) radio.checked = true;
    }
    syncNewRoundForm();
  } else if (target.name === 'holes' || target.name === 'nine' || target.id === 'round-tee') {
    syncNewRoundForm();
  } else if (target.name === 'course-count' && draft) {
    keepDraftNames();
    draft.count = Number(target.value);
    render();
  }
});

// Typing a stroke comment only updates the sheet's draft, so re-rendering the sheet (club or lie changes) keeps it.
app.addEventListener('input', event => {
  if (event.target.id === 'stroke-note' && sheet && sheet.draft) sheet.draft.note = event.target.value;
});

// Number fields in the course editor: keep digits only and update the draft as you type.
app.addEventListener('input', event => {
  const target = event.target;
  if (!draft) return;
  if (target.id === 'tee-name') {
    // Rename the tee's tab as you type.
    draft.tees[draft.teeIdx].name = target.value.trim();
    const tab = document.querySelector(`.tee-tab[data-i="${draft.teeIdx}"]`);
    if (tab) tab.textContent = target.value.trim() || `Tee ${draft.teeIdx + 1}`;
    updateDraftTotals();
  } else if (target.classList.contains('len')) {
    const digits = target.value.replace(/\D/g, '').slice(0, 4);
    if (digits !== target.value) target.value = digits;
    draft.tees[draft.teeIdx].holes[Number(target.dataset.i)].length = digits ? parseInt(digits, 10) : null;
    updateDraftTotals();
  } else if (target.classList.contains('opar') || target.classList.contains('oidx')) {
    const digits = target.value.replace(/\D/g, '').slice(0, target.classList.contains('opar') ? 1 : 2);
    if (digits !== target.value) target.value = digits;
    draft.tees[draft.teeIdx].holes[Number(target.dataset.i)][target.classList.contains('opar') ? 'par' : 'index'] = digits ? parseInt(digits, 10) : null;
    updateDraftTotals();
  } else if (target.classList.contains('idx')) {
    const digits = target.value.replace(/\D/g, '').slice(0, 2);
    if (digits !== target.value) target.value = digits;
    draft.all[Number(target.dataset.i)].index = digits ? parseInt(digits, 10) : null;
  }
});

/* ---------- Icon (used by "Add to Home Screen") ---------- */

(function makeIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 180;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1E5233';
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = '#EDF0E6';
    ctx.fillRect(84, 34, 7, 104);
    ctx.beginPath(); ctx.ellipse(88, 142, 36, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#C4372D';
    ctx.beginPath(); ctx.moveTo(91, 34); ctx.lineTo(142, 55); ctx.lineTo(91, 76); ctx.closePath(); ctx.fill();
    const url = canvas.toDataURL('image/png');
    const touchIcon = document.createElement('link');
    touchIcon.rel = 'apple-touch-icon'; touchIcon.href = url;
    const favicon = document.createElement('link');
    favicon.rel = 'icon'; favicon.href = url;
    document.head.append(touchIcon, favicon);
  } catch (err) { /* the icon is optional */ }
})();

/* ---------- Unlock slider ---------- */

// The knob must be dragged all the way to the right; letting go earlier springs it back and nothing happens.
// From the keyboard, arrow keys move it in steps and End jumps to the end.
let unlockDrag = null;  // { id, startX, max, x }

function unlockMax(knob) {
  const track = knob.parentElement;
  const pad = parseFloat(getComputedStyle(track).paddingLeft) || 0;
  return track.clientWidth - knob.offsetWidth - 2 * pad;
}
function moveKnob(knob, x, max) {
  knob.style.transform = `translateX(${x}px)`;
  knob.setAttribute('aria-valuenow', String(Math.round(x / max * 100)));
  const label = knob.parentElement.querySelector('.unlock-label');
  if (label) label.style.opacity = String(Math.max(0, 1 - x / max * 1.4));
}
// What a slider does once dragged all the way: unlock the hole, finish the round, or unlock the round.
function completeSlide(knob) {
  const action = knob.dataset.slide;
  if (action === 'unlock-hole') unlockHole();
  else if (action === 'finish-round') finishRound();
  else if (action === 'unlock-round') unlockRound();
}
function releaseKnob(knob, x, max) {
  if (x >= max - 2) { completeSlide(knob); return; }
  knob.classList.add('settle');
  moveKnob(knob, 0, max);
}

app.addEventListener('pointerdown', event => {
  const knob = event.target.closest('.unlock-knob');
  if (!knob) return;
  event.preventDefault();
  try { knob.setPointerCapture(event.pointerId); } catch (err) { /* capture is a nicety; dragging works without it */ }
  knob.classList.remove('settle');
  unlockDrag = { id: event.pointerId, startX: event.clientX, max: unlockMax(knob), x: 0 };
});
app.addEventListener('pointermove', event => {
  if (!unlockDrag || event.pointerId !== unlockDrag.id) return;
  const knob = event.target.closest('.unlock-knob');
  if (!knob) return;
  unlockDrag.x = Math.max(0, Math.min(unlockDrag.max, event.clientX - unlockDrag.startX));
  moveKnob(knob, unlockDrag.x, unlockDrag.max);
});
function endUnlockDrag(event) {
  if (!unlockDrag || event.pointerId !== unlockDrag.id) return;
  const knob = event.target.closest('.unlock-knob');
  const { x, max } = unlockDrag;
  unlockDrag = null;
  if (knob) releaseKnob(knob, event.type === 'pointercancel' ? 0 : x, max);
}
app.addEventListener('pointerup', endUnlockDrag);
app.addEventListener('pointercancel', endUnlockDrag);

app.addEventListener('keydown', event => {
  const knob = event.target.closest && event.target.closest('.unlock-knob');
  if (!knob) return;
  const max = unlockMax(knob);
  const now = Number(knob.getAttribute('aria-valuenow')) / 100 * max;
  let x = null;
  if (event.key === 'ArrowRight') x = Math.min(max, now + max / 4);
  else if (event.key === 'ArrowLeft') x = Math.max(0, now - max / 4);
  else if (event.key === 'End') x = max;
  else if (event.key === 'Home') x = 0;
  if (x === null) return;
  event.preventDefault();
  knob.classList.remove('settle');
  moveKnob(knob, x, max);
  if (x >= max - 2) completeSlide(knob);
});

/* ---------- Swipe a past round to delete ---------- */

// On the home screen a past round slides left with the finger to show its Delete button (88 px). Released past
// halfway it stays open, otherwise it springs back. Vertical drags scroll the list as usual (touch-action: pan-y).
const ROW_OPEN = 88;
let rowSwipe = null;   // { id, card, pointer, startX, startY, base, x, moved }
let swallowClickUntil = 0;   // the click that ends a drag must not open the round

function closeOpenRow() {
  const card = app.querySelector('.past-card.open');
  if (card) card.classList.remove('open');
  openRowId = null;
}

app.addEventListener('pointerdown', event => {
  const card = event.target.closest('.past-card');
  if (!card || view !== 'list' || sheet) { rowSwipe = null; return; }
  const base = card.classList.contains('open') ? -ROW_OPEN : 0;
  rowSwipe = { id: card.dataset.id, card, pointer: event.pointerId, startX: event.clientX, startY: event.clientY, base, x: base, moved: false };
});

app.addEventListener('pointermove', event => {
  const s = rowSwipe;
  if (!s || event.pointerId !== s.pointer) return;
  const dx = event.clientX - s.startX;
  const dy = event.clientY - s.startY;
  if (!s.moved) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { rowSwipe = null; return; }   // a scroll, not a swipe
    if (Math.abs(dx) < 8) return;
    s.moved = true;
    if (openRowId && openRowId !== s.id) closeOpenRow();
    s.card.classList.add('dragging');
    try { s.card.setPointerCapture(event.pointerId); } catch (err) { /* dragging works without capture */ }
  }
  s.x = Math.max(-ROW_OPEN, Math.min(0, s.base + dx));
  s.card.style.transform = `translateX(${s.x}px)`;
});

function endRowSwipe(event) {
  const s = rowSwipe;
  if (!s || event.pointerId !== s.pointer || !s.moved) return;
  s.card.classList.remove('dragging');
  s.card.style.transform = '';
  const open = event.type !== 'pointercancel' && s.x < -ROW_OPEN / 2;
  s.card.classList.toggle('open', open);
  openRowId = open ? s.id : null;
  rowSwipe = null;
  swallowClickUntil = performance.now() + 400;
}
app.addEventListener('pointerup', event => { endRowSwipe(event); if (rowSwipe && event.pointerId === rowSwipe.pointer) rowSwipe = null; });
app.addEventListener('pointercancel', endRowSwipe);

// Keyboard and screen reader users reach Delete by focus; it slides the row open so the button is visible.
app.addEventListener('focusin', event => {
  const del = event.target.closest && event.target.closest('.past-del');
  if (!del || openRowId === del.dataset.id) return;
  closeOpenRow();
  const card = del.parentElement.querySelector('.past-card');
  if (card) { card.classList.add('open'); openRowId = del.dataset.id; }
});

/* ---------- Swipe between holes ---------- */

// On the round screen a clear horizontal swipe moves to the next (left) or previous (right) hole, locked or not.
// Taps and vertical scrolling are unaffected; a drag that starts on the unlock slider's knob belongs to the slider.
const SWIPE_MIN = 60;   // px of horizontal finger travel for a swipe
let swipe = null;       // { x, y }

app.addEventListener('touchstart', event => {
  swipe = null;
  if (view !== 'round' || sheet || event.touches.length !== 1) return;
  if (event.target.closest('.unlock-knob')) return;
  const t = event.touches[0];
  swipe = { x: t.clientX, y: t.clientY };
}, { passive: true });

app.addEventListener('touchend', event => {
  if (!swipe) return;
  const t = event.changedTouches[0];
  const dx = t.clientX - swipe.x;
  const dy = t.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  swipeHole(dx < 0 ? 1 : -1);
}, { passive: true });
app.addEventListener('touchcancel', () => { swipe = null; });

function swipeHole(delta) {
  const round = getRound();
  const first = round.startHole || 1;
  const last = first + round.holeCount - 1;
  const target = round.currentHole + delta;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const screen = app.querySelector('.screen');
  if (target < first || target > last) {
    // No hole that way: a short bounce instead of navigating.
    if (!reduced && screen && screen.animate) {
      screen.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-delta * 14}px)` }, { transform: 'translateX(0)' }],
        { duration: 220, easing: 'ease-out' });
    }
    return;
  }
  changeHole(delta);
  // Slide the new hole's content in from the side the finger moved towards.
  if (!reduced) {
    app.querySelectorAll('.holebar, .counter, .strokes').forEach(el => {
      if (el.animate) el.animate([{ transform: `translateX(${delta * 28}px)`, opacity: 0.3 }, { transform: 'translateX(0)', opacity: 1 }],
        { duration: 180, easing: 'ease-out' });
    });
  }
}

/* ---------- Pull to refresh and updates ---------- */

// Reloads the app from the server, bypassing any cached copy. Saved data lives in localStorage and is not touched.
// The fetch refreshes the browser cache for this page; the throwaway ?fresh= parameter makes sure the
// navigation itself cannot be answered from an old cached copy. When offline, nothing is reloaded.
let reloading = false;
async function hardReload() {
  if (reloading) return;
  reloading = true;
  showPtr('updating');
  const base = location.pathname;
  try {
    const res = await fetch(base, { cache: 'reload' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
  } catch (err) {
    reloading = false;
    hidePtr();
    toast('Offline. Could not update right now.');
    return;
  }
  location.replace(base + '?fresh=' + Date.now() + location.hash);
}

const ptr = document.createElement('div');
ptr.id = 'ptr';
ptr.setAttribute('role', 'status');
ptr.innerHTML = `<span class="ptr-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></span><span class="ptr-label">Updating…</span>`;
document.body.appendChild(ptr);

const PTR_DEAD_ZONE = 12;   // px of finger travel before a pull can start, so taps and small drags never trigger it
const PTR_THRESHOLD = 70;   // px of indicator travel (about 150 px of finger travel) needed to reload
const PTR_MAX = 100;

function setPtr(distance, ready) {
  ptr.classList.remove('settle');
  ptr.classList.toggle('ready', ready);
  ptr.style.opacity = Math.min(1, distance / 30);
  ptr.style.transform = `translate(-50%, ${distance}px)`;
  ptr.querySelector('svg').style.transform = `rotate(${Math.round(distance / PTR_THRESHOLD * 270)}deg)`;
}
function showPtr(state) {
  ptr.classList.add('settle', state);
  ptr.style.opacity = 1;
  ptr.style.transform = `translate(-50%, ${PTR_THRESHOLD - 10}px)`;
  ptr.querySelector('svg').style.transform = '';
}
function hidePtr() {
  ptr.classList.add('settle');
  ptr.classList.remove('ready', 'updating');
  ptr.style.opacity = 0;
  ptr.style.transform = 'translate(-50%, 0)';
}

// A pull only starts inside a scrolling area (or the header) that is already scrolled to the very top,
// never while a sheet is open, and only when the finger moves clearly downward rather than sideways.
let pull = null;  // { x, y, scroller, active, decided }
app.addEventListener('touchstart', event => {
  if (reloading || sheet || event.touches.length !== 1) { pull = null; return; }
  const target = event.target;
  if (target.closest('input, select, textarea')) { pull = null; return; }
  const area = target.closest('.scroll, .strokes, .top');
  if (!area) { pull = null; return; }
  const scroller = area.classList.contains('top') ? null : area;
  if (scroller && scroller.scrollTop > 0) { pull = null; return; }
  const t = event.touches[0];
  pull = { x: t.clientX, y: t.clientY, scroller, active: false, decided: false };
}, { passive: true });

app.addEventListener('touchmove', event => {
  if (!pull) return;
  const t = event.touches[0];
  const dx = t.clientX - pull.x;
  const dy = t.clientY - pull.y;
  if (!pull.decided) {
    // A downward drag at the top can only bounce the list, so hold it back from the start: on iOS a gesture
    // that has begun scrolling can no longer be stopped later. Upward and sideways drags are left alone.
    if (dy > 0 && dy >= Math.abs(dx) && event.cancelable) event.preventDefault();
    if (Math.abs(dx) < PTR_DEAD_ZONE && Math.abs(dy) < PTR_DEAD_ZONE) return;
    pull.decided = true;
    // Upward or sideways first movement, or a list that has scrolled meanwhile: leave the gesture to normal scrolling.
    if (dy <= 0 || Math.abs(dx) * 1.5 > dy || (pull.scroller && pull.scroller.scrollTop > 0)) { pull = null; return; }
    pull.active = true;
  }
  if (!pull.active) return;
  event.preventDefault();  // stop the list from rubber-banding while we show the indicator
  const distance = Math.max(0, Math.min(PTR_MAX, (dy - PTR_DEAD_ZONE) * 0.5));
  pull.distance = distance;
  setPtr(distance, distance >= PTR_THRESHOLD);
}, { passive: false });

function endPull() {
  if (!pull) return;
  const ready = pull.active && pull.distance >= PTR_THRESHOLD;
  pull = null;
  if (ready) hardReload(); else hidePtr();
}
app.addEventListener('touchend', endPull);
app.addEventListener('touchcancel', () => { pull = null; if (!reloading) hidePtr(); });

// On a normal start, quietly compare the page we are running with the one on the server.
// If they differ, the rounds list offers an update instead of reloading in the middle of a round.
async function checkForUpdate() {
  if (!navigator.onLine) return;
  try {
    const base = location.pathname;
    const [running, latest] = await Promise.all([
      fetch(base, { cache: 'force-cache' }).then(r => r.ok ? r.text() : null),
      fetch(base, { cache: 'no-store' }).then(r => r.ok ? r.text() : null)
    ]);
    if (running && latest && running !== latest) {
      updateAvailable = true;
      if (view === 'list' && !sheet) render();
    }
  } catch (err) { /* offline or blocked: just skip the check */ }
}

/* ---------- Start ---------- */

// Courses saved before tees existed are converted once and saved back, so the rest of the app only sees tees.
if (db.courses.map(migrateCourse).some(Boolean)) saveDb();
// Strokes saved before stroke ids existed get one, once.
if (migrateStrokeIds(db)) saveDb();
if (watchBridge) {
  watchBridge.postMessage({ type: 'hello' });   // the iOS app delivers anything logged on the watch meanwhile
  scheduleWatchSnapshot();                      // and the watch gets the current round without waiting for a change
}

// After a pull-to-refresh, drop the throwaway ?fresh= parameter from the address.
if (new URLSearchParams(location.search).has('fresh')) {
  history.replaceState(null, '', location.pathname + location.hash);
} else {
  setTimeout(checkForUpdate, 3000);
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

if (db.activeRoundId && db.rounds.some(r => r.id === db.activeRoundId)) {
  openRound(db.activeRoundId);
} else {
  render();
}
</script>
</body>
</html>
