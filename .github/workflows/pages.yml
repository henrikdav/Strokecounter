# Runs the tests, then publishes web/ to GitHub Pages, so the app keeps its URL (henrikdav.github.io/Strokecounter/).
# Nothing is published when a test fails. Pull requests run the tests only; publishing happens from main.
name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: [web/**, tests/**, ios/StrokeCounter/gps-shim.js, .github/workflows/pages.yml]
  pull_request:
    branches: [main]
    paths: [web/**, tests/**, ios/StrokeCounter/gps-shim.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or pull request at a time, so a pull request's tests never cancel a deploy from main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest   # has Chrome and python3, which tests/run.sh needs
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
