# Runs the tests, then publishes web/ to GitHub Pages, so the app keeps its URL (henrikdav.github.io/Strokecounter/).
# Nothing is published when a test fails.
name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: [web/**, tests/**, ios/StrokeCounter/gps-shim.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest   # has Chrome and python3, which tests/run.sh needs
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
