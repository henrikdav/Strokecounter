name: StrokeCounter
options:
  bundleIdPrefix: com.henrikdav
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StrokeCounter:
    type: application
    platform: iOS
    dependencies:
      - target: StrokeCounterWatch
    sources:
      - StrokeCounter
      # Temporary scaffold: the web app is copied into the bundle as a folder (web/index.html).
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrikdav.StrokeCounter
        DEVELOPMENT_TEAM: 848GGC8882
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Used to measure shot distances and track your position on the course during a round.
        TARGETED_DEVICE_FAMILY: "1"

  # Native Apple Watch app (sources in ../watch), embedded in the iOS app and synced with it over WatchConnectivity.
  StrokeCounterWatch:
    type: application
    platform: watchOS
    scheme:
      testTargets: [StrokeCounterWatchTests]
    sources:
      - ../watch/StrokeCounterWatch
    # HealthKit, only to run a golf workout session during a round (nothing is saved to Health).
    entitlements:
      path: ../watch/StrokeCounterWatch/StrokeCounterWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: ../watch/StrokeCounterWatch/Info.plist
      properties:
        WKBackgroundModes: [workout-processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrikdav.StrokeCounter.watchkitapp
        PRODUCT_NAME: StrokeCounterWatch
        DEVELOPMENT_TEAM: 848GGC8882
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stroke Counter
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.henrikdav.StrokeCounter
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Used to record where each stroke you log on the watch was played from.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Stroke Counter does not read any health data.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Runs a golf workout during a round so the app stays open on your wrist and keeps GPS on. The workout is not saved to Health.
        SKIP_INSTALL: YES

  # Unit tests for the watch app's round logic (RoundState). Run: xcodebuild test -scheme StrokeCounterWatch.
  StrokeCounterWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - ../watch/StrokeCounterWatchTests
    dependencies:
      - target: StrokeCounterWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henrikdav.StrokeCounter.watchkitapp.tests
        DEVELOPMENT_TEAM: 848GGC8882
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
